<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cardápio · Sesconetto's Pizzeria</title>
  <meta name="description" content="Cardápio completo: pizzas napolitanas salgadas e doces, combos, sanduíche, molhos e bebidas.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sesconetto's">
  <link rel="preload" href="/fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/young-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="tem-sub">
  <main>
    <div class="chips-wrap"><div class="container">
      <div class="chips-linha" data-chips-linha>
        <button type="button" class="chip chip-busca" data-abrir-busca aria-label="Buscar no cardápio"><span data-icone="busca"></span></button>
        <div class="chips" data-chips><div class="chips-skel" aria-hidden="true"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></div>
      </div>
      <div class="busca-cardapio" data-busca-cardapio hidden role="search">
        <div class="campo-busca"><span data-icone="busca"></span><input type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar sabor, bebida, vinho…" aria-label="Buscar no cardápio"><button type="button" class="limpar" data-limpar-busca aria-label="Limpar busca" hidden><span data-icone="x"></span></button></div>
        <button type="button" class="fechar-busca" data-fechar-busca>Cancelar</button>
      </div>
    </div></div>
    <div class="container" style="padding: 8px 0 40px">
      <div data-resultados hidden></div>
      <div data-secoes></div>
    </div>
  </main>
  <script type="module" src="js/pages/cardapio.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Minha conta — Sesconetto's Pizzeria</title>
  <meta name="theme-color" content="#1f1b18">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sesconetto's">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="container" style="max-width:720px;padding:24px 16px 40px" data-raiz>
      <!-- js/pages/conta.js monta aqui: entrada (celular + PIN) ou o painel do cashback -->
      <div class="painel"><div class="skeleton-conta" aria-busy="true" aria-label="Carregando">
        <div class="skeleton" style="height:64px;width:64px;border-radius:50%;margin:8px auto 4px"></div>
        <div class="skeleton" style="height:22px;width:60%;margin:0 auto"></div>
        <div class="skeleton" style="height:46px"></div>
        <div class="skeleton" style="height:46px"></div>
        <div class="skeleton" style="height:52px;border-radius:999px"></div>
      </div></div>
    </div>
  </main>
  <script type="module" src="js/pages/conta.js"></script>
</body>
</html>

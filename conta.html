  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preload" href="/fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <main id="conteudo" tabindex="-1">
    <h1 class="sr">Minha conta</h1>
    <div class="container" style="max-width:720px;padding:24px 16px 40px" data-raiz>
      <!-- js/pages/conta.js monta aqui: entrada (celular + PIN) ou o painel do cashback -->
      <div class="painel"><div class="skeleton-conta" aria-busy="true" aria-label="Carregando">
        <div class="skeleton" style="height:64px;width:64px;border-radius:50%;margin:8px auto 4px"></div>
        <div class="skeleton" style="height:22px;width:60%;margin:0 auto"></div>
        <div class="skeleton" style="height:46px"></div>
        <div class="skeleton" style="height:46px"></div>
        <div class="skeleton" style="height:52px;border-radius:999px"></div>
      </div></div>
    </div>
  </main>
  <script type="module" src="js/pages/conta.js"></script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixxel Estúdio</title>
<style>
/* tema escuro no jeito do Photoshop (com o dourado do Kome de destaque) */
:root{--bg0:#1e1e1e;--bg1:#2b2b2b;--bg2:#323232;--bg3:#3c3c3c;--bg4:#4a4a4a;--line:#191919;--txt:#d6d6d6;--txt2:#9a9a9a;--acc:#2d8ceb;--acc2:#1a6fc4;--gold:#F3C94A;--ok:#5fb85f;--bad:#d9534f;--desk:#262626;
  --font:'Segoe UI','Inter','Helvetica Neue',system-ui,sans-serif;--dockw:310px}
:root.claro{--bg0:#e9e2d2;--bg1:#f6eedc;--bg2:#efe2c4;--bg3:#fffaee;--bg4:#e3d4b4;--line:#3b2818;--txt:#2a1a10;--txt2:#6b5038;--acc:#b4852a;--acc2:#8a6418;--desk:#d8ccb0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);font:12px var(--font)}
button,select,input,textarea{font:inherit;color:inherit}
select,input[type=number],input[type=text]{background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:2px 5px;color:var(--txt);max-width:100%}
input[type=range]{accent-color:var(--acc);vertical-align:middle}
input[type=color]{width:34px;height:20px;border:1px solid var(--line);padding:0;background:none}
#app{display:grid;grid-template-rows:28px 34px 1fr;height:100vh}
/* barra de menu */
#top{display:flex;align-items:center;gap:2px;background:var(--bg1);border-bottom:1px solid var(--line);padding:0 6px}
#top .logo{display:flex;align-items:center;gap:6px;margin-right:8px;font-weight:700}
#top .logo i{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#D9A066,#F3C94A);display:inline-block;box-shadow:inset 0 0 0 1px #0006}
.mb{background:none;border:none;color:var(--txt);padding:4px 8px;border-radius:3px;cursor:pointer}
.mb:hover,.mb.on{background:var(--bg3)}
.menu{position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px #0008;padding:4px;min-width:280px;max-height:80vh;overflow:auto}
.menu hr{border:none;border-top:1px solid var(--line);margin:3px 0}
.mi{display:flex;justify-content:space-between;gap:20px;width:100%;background:none;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;text-align:left}
.mi:hover{background:var(--acc);color:#fff}
.mi small{opacity:.6}
#quick{margin-left:auto;display:flex;gap:4px;align-items:center}
.qb{background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:3px;padding:3px 10px;cursor:pointer;font-weight:600}
.qb:hover{background:var(--bg4)}
.qb.magic{background:linear-gradient(90deg,#7a4fd0,#2d8ceb);color:#fff;border-color:#0006}
.qb.on{background:var(--acc);color:#fff}
/* barra de opções */
#ctx{display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}
#ctx label{display:flex;gap:5px;align-items:center}
#ctx .ctxicon{width:24px;height:24px;image-rendering:pixelated}
#ctx .sep{width:1px;height:20px;background:var(--line)}
/* corpo */
#main{display:grid;grid-template-columns:44px 1fr 5px var(--dockw);min-height:0}
#tools{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:1px;overflow-y:auto;overflow-x:visible}
.tool{position:relative;width:36px;height:32px;border:none;border-radius:3px;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.tool canvas{image-rendering:pixelated;width:24px;height:24px}
.tool:hover{background:var(--bg3)}
.tool.on{background:var(--bg4);box-shadow:inset 0 0 0 1px var(--acc)}
.tool.grp::after{content:'';position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:var(--txt2);border-bottom-color:var(--txt2)}
.tool.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--gold)}}
.tsep{width:26px;height:1px;background:var(--line);margin:3px 0}
.fgbg{position:relative;width:36px;height:36px;margin-top:6px}
.fgbg .sw{position:absolute;width:22px;height:22px;border:1px solid #000;box-shadow:0 0 0 1px #fff5;cursor:pointer}
.fgbg .fg{left:2px;top:2px;z-index:2}.fgbg .bg{right:2px;bottom:2px}
.flyout{position:fixed;z-index:70;background:var(--bg2);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 20px #0008;padding:3px}
.flyout button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:3px 10px 3px 4px;cursor:pointer;border-radius:3px;white-space:nowrap}
.flyout button:hover{background:var(--acc);color:#fff}
.flyout canvas{width:20px;height:20px;image-rendering:pixelated}
.flyout small{margin-left:auto;padding-left:16px;opacity:.6}
#center{display:grid;grid-template-rows:26px 1fr auto 22px;min-width:0;min-height:0}
#doctabs{display:flex;gap:1px;background:var(--bg1);overflow-x:auto;border-bottom:1px solid var(--line)}
.dtab{display:flex;align-items:center;gap:6px;background:var(--bg2);color:var(--txt2);padding:3px 6px 3px 10px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--line)}
.dtab.on{background:var(--desk);color:var(--txt)}
.dtab.add{border:none;padding:3px 10px}
.ib{background:none;border:none;cursor:pointer;padding:0 3px;color:inherit;line-height:1;font-size:13px}
#cvwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--desk)}
#cv{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#status{display:flex;gap:16px;align-items:center;padding:0 10px;background:var(--bg1);border-top:1px solid var(--line);color:var(--txt2);font-size:11px}
#split{background:var(--bg0);cursor:col-resize}
#split:hover{background:var(--acc)}
/* dock de painéis */
#dock{background:var(--bg1);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.panel{border-bottom:1px solid var(--line)}
.ptabs{display:flex;background:var(--bg0);border-bottom:1px solid var(--line);user-select:none}
.ptab{background:none;border:none;color:var(--txt2);padding:5px 10px;cursor:pointer;font-weight:600;font-size:11px;border-right:1px solid var(--line)}
.ptab.on{background:var(--bg1);color:var(--txt)}
.ptabs .grow{flex:1}
.pbody{padding:6px 8px}
.panel[data-tabs="magica,tipo,props"] .pbody{max-height:250px;overflow-y:auto}
.panel[data-tabs="cor,amostras"] .pbody{max-height:230px;overflow-y:auto}
#pv{max-height:150px}
.panel.closed .pbody{display:none}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
.hint{font-size:11px;color:var(--txt2)}
.tb{border:1px solid var(--line);border-radius:3px;background:var(--bg3);padding:3px 9px;cursor:pointer;font-weight:600}
.tb:hover{background:var(--bg4)}
.tb.on{background:var(--acc);color:#fff}
.tb.big{padding:6px 14px;font-size:13px}
.tb.green{background:#2f6b37;color:#fff}.tb.green:hover{background:#3a8344}
.tb.red{background:#7a2f2b;color:#fff}
.tb.magic{background:linear-gradient(90deg,#7a4fd0,#2d8ceb);color:#fff}
.tb:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{border:1px solid var(--line);border-radius:3px;background:var(--bg3);padding:2px 8px;cursor:pointer;font-size:11px}
.chip.on{background:var(--acc);color:#fff}
label.chip input{display:none}
#pv{width:100%;image-rendering:pixelated;display:block;border:1px solid var(--line);background:#9FD3E8}
.sv,.hue{width:100%;display:block;border:1px solid var(--line);margin-top:5px;cursor:crosshair;touch-action:none}
.swpair{position:relative;width:46px;height:40px}
.swbig{position:absolute;width:28px;height:28px;border:1px solid #000;box-shadow:0 0 0 1px #fff4;cursor:pointer}
.swbig.fg{left:0;top:0;z-index:2}.swbig.bg{right:0;bottom:0}
.hex{width:100%}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:1px;max-height:150px;overflow:auto}
.palgrid .sw{height:16px;cursor:pointer;border:1px solid #0006}
.palgrid .sw.on{outline:2px solid #fff;outline-offset:-1px}
/* camadas no jeito do PS */
.lyopts{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.lyopts select{flex:1}
#layers{max-height:260px;overflow-y:auto;background:var(--bg0);border:1px solid var(--line)}
.lyr{display:flex;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg2)}
.lyr.on{background:var(--acc2);color:#fff}
.lyr canvas{width:34px;height:28px;image-rendering:pixelated;background:repeating-conic-gradient(#bbb 0 25%,#eee 0 50%) 0 0/8px 8px;border:1px solid #000}
.lyr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .bl{font-size:10px;opacity:.7}
.lyr.drag{opacity:.4}
.lyr.dropT{box-shadow:inset 0 2px 0 var(--gold)}
.lybtns{display:flex;gap:2px;justify-content:flex-end;margin-top:4px}
.lybtns button{background:var(--bg3);border:1px solid var(--line);border-radius:3px;cursor:pointer;padding:2px 7px}
#histPanel{max-height:200px;overflow:auto;background:var(--bg0);border:1px solid var(--line)}
.hi{padding:3px 8px;cursor:pointer;border-bottom:1px solid var(--line)}
.hi.on{background:var(--acc2);color:#fff}.hi.fut{opacity:.4}
.typegrid{display:flex;flex-wrap:wrap;gap:3px}
.typegrid .tg{width:100%;font-size:10px;font-weight:700;color:var(--txt2);margin-top:3px;text-transform:uppercase}
.tprev{width:100%;image-rendering:pixelated;border:1px solid var(--line);display:block;margin-top:4px}
.magicbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:5px 8px;margin:3px 0;cursor:pointer}
.magicbtn:hover{background:var(--bg3);border-color:#7a4fd0}
.magicbtn span{font-size:10.5px;color:var(--txt2)}
/* linha do tempo (animação de quadros, como no PS) */
#tl{background:var(--bg1);border-top:1px solid var(--line);max-height:34vh;display:flex;flex-direction:column}
#tl.closed #tlbody{display:none}
#tlhead{display:flex;align-items:center;gap:4px;padding:3px 8px;border-bottom:1px solid var(--line)}
#tlbody{overflow:auto;padding:4px 8px}
#tltags{display:flex;height:14px;margin-bottom:2px;position:relative}
.ttag{position:absolute;top:0;height:13px;border-radius:2px;font-size:9px;font-weight:700;color:#fff;padding:0 4px;white-space:nowrap;overflow:hidden;cursor:pointer;text-shadow:0 1px 0 #0008}
#tlframes{display:flex;gap:4px}
.fr{flex:none;width:62px;background:var(--bg2);border:1px solid var(--line);border-radius:3px;cursor:pointer;text-align:center;font-size:10px;padding:2px}
.fr.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.fr canvas{width:56px;height:44px;image-rendering:pixelated;background:repeating-conic-gradient(#999 0 25%,#ccc 0 50%) 0 0/8px 8px;display:block;margin:0 auto 2px}
.fr small{color:var(--txt2)}
/* mapa */
#wsMap{grid-column:2/5;display:grid;grid-template-columns:300px 1fr;min-height:0;background:var(--bg1)}
.mapside{overflow:auto;border-right:1px solid var(--line);padding:6px 10px}
.mapside h3{margin:10px 0 4px;font-size:12px}
.tswrap{max-height:260px;overflow:auto;border:1px solid var(--line);background:#e9e2d2}
.tscv{image-rendering:pixelated;display:block;cursor:pointer}
.mapmain{display:grid;grid-template-rows:auto 1fr;min-height:0}
.toolbar{display:flex;gap:6px;padding:5px;background:var(--bg2);border-bottom:1px solid var(--line);align-items:center}
.toolbar .sp{flex:1}
.seg{display:flex;gap:2px}
.mapwrap{overflow:auto;padding:12px;background:var(--desk)}
.mapcv{image-rendering:pixelated;display:block;cursor:crosshair}
.mlayers .ly{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:3px 6px;margin:2px 0;background:var(--bg2);cursor:pointer}
.mlayers .ly.on{background:var(--acc2);color:#fff}
.mlayers .nm{flex:1}
.playov{position:fixed;inset:0;z-index:80;background:#000d;display:grid;place-items:center}
.playov canvas{width:min(96vw,calc(88vh*16/9));image-rendering:pixelated;border:3px solid #000;border-radius:6px}
.playhint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700}
.playx{position:fixed;top:14px;right:14px}
/* diálogos */
.ov{position:fixed;inset:0;z-index:50;background:#0009;display:grid;place-items:center}
.dlg{background:var(--bg1);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 40px #000a;width:min(480px,94vw);max-height:90vh;display:flex;flex-direction:column}
.dlg.wide{width:min(980px,96vw)}
.dlg.lib{width:min(1280px,97vw);height:90vh}
.dhead{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2);border-radius:6px 6px 0 0}
.dhead .chips{flex:1}
.dbody{padding:12px;overflow:auto}
.dfoot{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.libbody{display:flex;flex-direction:column;min-height:0;flex:1}
.libopts{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px;padding:10px;overflow:auto;align-content:start}
.gitem{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.gitem:hover{border-color:var(--acc)}
.gitem.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:var(--bg3)}
.gitem canvas,.gitem img{image-rendering:pixelated;max-width:100%;height:84px;object-fit:contain;background:repeating-conic-gradient(#3a3a3a 0 25%,#444 0 50%) 0 0/10px 10px}
:root.claro .gitem canvas,:root.claro .gitem img{background:repeating-conic-gradient(#e9e2d2 0 25%,#fffaee 0 50%) 0 0/10px 10px}
.gitem .nm{font-size:11px;text-align:center}
.noimg{height:84px}
.help h4{margin:10px 0 2px}.help p{margin:0;line-height:1.7}
.help b{background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-weight:600}
/* construtores e rascunhos */
.cbody{display:grid;grid-template-columns:320px 1fr;min-height:0;flex:1}
.cside{overflow:auto;padding:8px 12px;border-right:1px solid var(--line)}
.cside h4{margin:10px 0 4px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
.crow input[type=range]{width:150px}
.cmain{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.cpv{width:100%;max-width:820px;image-rendering:pixelated;border:1px solid var(--line)}
.cstrip{display:flex;flex-wrap:wrap;gap:6px}
.cpose{border:1px solid var(--line);border-radius:4px;background:var(--bg2);padding:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px}
.cpose canvas{image-rendering:pixelated;width:72px;height:62px;object-fit:contain}
.cpose.on{border-color:var(--acc);background:var(--bg3)}
.hub,.hubrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.hubitem{border:1px solid var(--line);border-radius:6px;background:var(--bg2);padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hubitem canvas{image-rendering:pixelated}
.hubitem:hover{border-color:var(--acc);background:var(--bg3)}
.hubitem.big{min-height:96px;justify-content:center}
.hubitem.magicbg{background:linear-gradient(135deg,#3a2a66,#1d4a7a);color:#fff}
.home{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.home h3{margin:6px 0 8px}
.rbody{display:grid;grid-template-columns:200px 1fr 280px;min-height:0;flex:1}
.rside{border-right:1px solid var(--line);overflow:auto;padding:6px}
.rside hr{border:none;border-top:1px solid var(--line)}
.rcat{display:flex;justify-content:space-between;width:100%;background:none;border:none;text-align:left;padding:6px 10px;border-radius:3px;cursor:pointer}
.rcat:hover{background:var(--bg3)}.rcat.on{background:var(--acc);color:#fff}
.rcat small{opacity:.6}
.rdet{border-left:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.rdet canvas{image-rendering:pixelated;max-width:100%;background:repeating-conic-gradient(#3a3a3a 0 25%,#444 0 50%) 0 0/12px 12px;align-self:center}
.rdet h3{margin:4px 0}
/* modo guiado */
#guideCard{position:absolute;left:12px;top:12px;width:330px;z-index:5;background:var(--bg2);border:1px solid #7a4fd0;border-radius:8px;box-shadow:0 8px 24px #0009;padding:10px 12px}
#guideCard .gtop{display:flex;gap:8px;align-items:center}
#guideCard .gtop span{color:var(--txt2);margin-left:auto}
#guideCard h4{margin:8px 0 4px;font-size:14px;color:var(--gold)}
#guideCard p{margin:0 0 6px;line-height:1.5}
#guideBar{height:8px;background:var(--bg0);border-radius:4px;overflow:hidden;margin:6px 0 2px}
#guideBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a4fd0,#5fb85f);transition:width .2s}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:8px 14px;border-radius:5px;border:1px solid var(--acc);opacity:0;transition:.2s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
body.nopanels #dock,body.nopanels #split,body.nopanels #tools,body.nopanels #ctx{display:none}
body.nopanels #main{grid-template-columns:0 1fr 0 0}
@media (max-width:900px){#main{grid-template-columns:44px 1fr 0 0}#dock{display:none}.rbody{grid-template-columns:1fr}.rside,.rdet{display:none}.home{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo"><i></i><span>Pixxel Estúdio</span></div>
    <div id="menubar"></div>
    <div id="quick">
      <button class="qb" onclick="Studio.openHome()" title="tela inicial">Início</button>
      <button class="qb magic" onclick="Studio.guidesDialog()" title="aprenda fazendo">✨ Modo guiado</button>
      <button class="qb" onclick="Studio.openRascunhos()" title="rascunhos prontos com camadas (Ctrl+Shift+N… não: Alt+R)">Rascunhos</button>
      <button class="qb" onclick="Studio.openBuildHub()" title="Ctrl+B">Construir</button>
      <button class="qb" onclick="Studio.openLibrary()" title="Ctrl+L">Biblioteca</button>
      <span style="width:10px"></span>
      <button class="qb on" data-ws="draw">Desenhar</button><button class="qb" data-ws="map">Mapa &amp; jogo</button>
    </div>
  </div>
  <div id="ctx"></div>
  <div id="main">
    <div id="tools"></div>
    <div id="center">
      <div id="doctabs"></div>
      <div id="cvwrap"><canvas id="cv"></canvas></div>
      <div id="tl"></div>
      <div id="status"><span id="stZoom"></span><span id="stSize"></span><span id="stPos">—</span><span id="stTool"></span><span id="saveInfo" style="margin-left:auto">salvamento automático ligado</span></div>
    </div>
    <div id="split" title="arraste pra mudar a largura dos painéis"></div>
    <div id="dock">
      <div class="panel" id="pPrev"><div class="ptabs"><button class="ptab on">Prévia no jogo</button><span class="grow"></span></div><div class="pbody">
        <canvas id="pv" width="300" height="170"></canvas>
        <div class="row">tag <select id="pvTag"><option value="">tudo</option></select> escala <select id="pvScale"><option value="0">real do jogo</option><option value="9" selected>caber</option></select> <label><input type="checkbox" id="pvPlay" checked> tocar</label></div>
        <div class="row">fundo <select id="pvBg"><option value="dia">dia</option><option value="tarde">pôr do sol</option><option value="noite">noite</option><option value="xadrez">xadrez</option></select> <label><input type="checkbox" id="pvKome"> estilo Kome</label> <label><input type="checkbox" id="pvWithK" checked> Kome</label> <select id="pvPose"></select></div>
      </div></div>
      <div class="panel" data-tabs="cor,amostras"><div class="ptabs"></div><div class="pbody"><div data-t="cor" id="colorPanel"></div><div data-t="amostras" id="palPanel"></div></div></div>
      <div class="panel" data-tabs="magica,tipo,props"><div class="ptabs"></div><div class="pbody"><div data-t="magica" id="magicPanel"></div><div data-t="tipo" id="typePanel"></div><div data-t="props" id="propsPanel"></div></div></div>
      <div class="panel" data-tabs="camadas,historico" style="flex:1"><div class="ptabs"></div><div class="pbody"><div data-t="camadas" id="layersPanel"></div><div data-t="historico"><div id="histPanel"></div><div class="row"><button class="tb" onclick="Studio.undo()">↶ Desfazer</button><button class="tb" onclick="Studio.redo()">↷ Refazer</button></div></div></div></div>
    </div>
    <div id="wsMap" style="display:none"></div>

<div id="k-rot"><div class="k-rot-card"><canvas id="k-rot-cv" width="96" height="80"></canvas><b>Vira o celular de lado</b><span>o Kome cava melhor deitado ↻</span></div></div>
<style>#k-rot{position:fixed;inset:0;z-index:9999;background:linear-gradient(#7EC4EC,#D8F0FA 60%,#8DB46A 60%);display:none;align-items:center;justify-content:center}
#k-rot .k-rot-card{background:#FFFAEE;border:3px solid #3B2818;border-radius:18px;box-shadow:0 5px 0 #3B2818;padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;font:800 18px system-ui,sans-serif;color:#2A1A10;text-align:center}
#k-rot .k-rot-card span{font-weight:600;font-size:15px;opacity:.8}#k-rot canvas{image-rendering:pixelated;width:144px;height:120px;animation:krot 2.2s ease-in-out infinite}
@keyframes krot{0%,30%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (max-width:820px) and (pointer:coarse){#k-rot{display:flex}}</style>
<script>if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>

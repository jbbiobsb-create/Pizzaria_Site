<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kome no Japão · Trem-Bala de Arroz</title>
<style>html, body { margin: 0; height: 100%; background: #3B2818; overflow: hidden; }</style>
</head>
<body>
<script src="../engine/core.js"></script>
<script src="../engine/pix.js"></script>
<script src="../engine/shiba.js"></script>
<script src="../engine/fx.js"></script>
<script src="../engine/audio.js"></script>
<script src="../engine/terrain.js"></script>
<script src="../engine/rig.js"></script>
<script src="../game/trembala.js"></script>
<script>
/* Demo de game/trembala.js.
   URL: ?mode=normal|chegada  &z=zoom (padrão: câmera sugerida m.cam)  &face=-1  &night=1  &t=segundos (avança e congela)
        &spd=speedMul  &dig=0  &debug=1  &cx=desvio da câmera  &cy=  &horizon=1 (testa o desenho do horizonte do Pátio, &n=quantidade)
        &cam=cockpit (zoom na cabine do Kome)
   Som: clique/tecla destrava o áudio (ding-dong, chiado, apito, BUUUM, trilho, freio); M = mudo.
   Automação: __demo.step(seg) avança em passos fixos de 1/60; __demo.m = instância; __demo.cost() = ms por draw (média de 60). */
(function () {
  'use strict';
  const E = KomeEngine, U = E.U, PAL = E.PAL, Draw = E.Draw, G = KomeGame;
  const W = 960, H = 540;
  const q = new URLSearchParams(location.search);
  const MODE = q.get('mode') === 'chegada' ? 'chegada' : 'normal', FACE = +(q.get('face') || 1) < 0 ? -1 : 1;
  const NIGHT = q.get('night') === '1', SPD = +(q.get('spd') || 1), NODIG = q.get('dig') === '0', HOR = q.get('horizon') === '1';
  const stage = E.Stage({ width: W, height: H, bg: PAL.ink });
  const g = stage.g;
  const input = E.Input(stage);
  const SOIL = '#C7A26A', SOIL_D = '#A8834F';
  const tool = G.Tools.trembala;
  const m = tool.create({ pilot: 'kome', mode: MODE });
  const parts = E.Particles(1400);
  const DOCK = 1800 * FACE;
  // montanha de arroz atrás da linha (mais larga que o trem quase todo; a ponta de trás fica sem montanha: torre de carga)
  const heap = E.Heap({ width: 7600, colW: 8, x0: -3800, y0: 0, seed: 11 });
  heap.generate(x => { const u = (x * FACE + 250) / 2600; const k = 1 - u * u; return k > 0 ? 1180 * Math.pow(k, 0.75) + 30 * Math.sin(x * 0.011) + 14 * Math.sin(x * 0.031) : 0; });
  const inp = { x: DOCK, y: 0, face: FACE, digging: !NODIG, speedMul: SPD, floor: x => -heap.height(x), parts, night: NIGHT ? 1 : 0, view: null };
  const cam = { x: 0, y: -300, z: q.has('z') ? +q.get('z') : 0.2 };
  const CX = +(q.get('cx') || 0), CY = +(q.get('cy') || 0);
  const log = []; let logT = 0, T = 0, dug = 0, mute = false;
  const unlock = () => { try { E.Audio && E.Audio.unlock(); } catch (e) { /* sem áudio */ } };
  addEventListener('pointerdown', unlock); addEventListener('keydown', e => { unlock(); if (e.key === 'm' || e.key === 'M') mute = !mute; });
  const view = { x0: 0, x1: 0, y0: 0, y1: 0 };
  function update(dt) {
    T += dt; inp.view = view;
    tool.update(m, dt, inp);
    if (tool.audio) tool.audio(m, !mute);
    for (const ev of m.ev) { log.unshift(ev); if (log.length > 6) log.pop(); logT = 2.2; }
    logT -= dt;
    dug += tool.dig(m, heap, 1400 * 8 * dt * SPD);
    heap.relax(dt);
    parts.update(dt, x => (Math.abs((DOCK - x) * FACE - 630) < 930 ? -30 : 0));
    if (q.get('cam') === 'cockpit') { const s = tool.seat(m); cam.x = s.x; cam.y = s.y; cam.z = q.has('z') ? +q.get('z') : 1.6; }
    else if (HOR) { cam.x = 0; cam.y = -200; cam.z = q.has('z') ? +q.get('z') : 0.5; }
    else { cam.x = m.cam.x + CX; cam.y = m.cam.y + CY; if (!q.has('z')) cam.z = m.cam.z; }
  }
  function sky(v) {
    g.fillStyle = NIGHT ? PAL.night : PAL.sky; g.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    if (!NIGHT) { g.fillStyle = U.mixCss(PAL.sky, PAL.skyL, 0.5); g.fillRect(v.x0, -700, v.x1 - v.x0, 710); }
    g.fillStyle = U.mixCss(PAL.grassL, NIGHT ? PAL.night : PAL.sky, 0.55); g.beginPath(); g.moveTo(v.x0, 10);
    for (let x = v.x0; x <= v.x1 + 64; x += 64) g.lineTo(x, -420 - 200 * Math.sin(x * 0.0007 + 1) - 60 * Math.sin(x * 0.002));
    g.lineTo(v.x1 + 64, 10); g.closePath(); g.fill();
  }
  function ground(v) {
    g.fillStyle = SOIL; g.fillRect(v.x0, 0, v.x1 - v.x0, v.y1);
    g.fillStyle = PAL.grass; g.fillRect(v.x0, 0, v.x1 - v.x0, 5);
    g.fillStyle = SOIL_D; g.fillRect(v.x0, 12, v.x1 - v.x0, 3);
  }
  // cena de teste do horizonte (como o Pátio chama: G.Tools.trembala.horizon)
  function horizonScene(v) {
    const sky0 = '#CFE3F2';
    g.fillStyle = sky0; g.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    const tint = [U.mixCss('#7C8C9E', sky0, 0.35), U.mixCss('#93A3B4', sky0, 0.5), U.mixCss('#AAB8C6', sky0, 0.62)];
    const n = +(q.get('n') || 30);
    g.fillStyle = U.mixCss('#B9C8A8', sky0, 0.7); g.fillRect(v.x0, -40, v.x1 - v.x0, 60);
    tool.horizon(g, { x0: -900, x1: 900, y: -22, k: 0.12, t: T, n, tint: tint[1], haze: 0.78, night: NIGHT ? 1 : 0 });
    g.fillStyle = U.mixCss('#9DB083', sky0, 0.38); g.fillRect(v.x0, -12, v.x1 - v.x0, 30);
    ground(v);
    E.drawShiba(g, 0, 20, 'sit', T, { scale: 1, pal: 'kome' });
    Draw.text(g, 'horizonte do Pátio · n=' + n, 0, -330, { size: 22, col: PAL.cream, sw: 4 });
  }
  let drawMs = 0, drawN = 0;
  function render() {
    stage.begin();
    const c = cam, gy = H * 0.5;
    const shake = m.shakeK > 0 ? m.shakeK * m.shakeK * 26 : 0;
    g.save();
    g.translate(W / 2 + (Math.random() - 0.5) * shake, gy + (Math.random() - 0.5) * shake); g.scale(c.z, c.z); g.translate(-c.x, -c.y);
    view.x0 = c.x - W / 2 / c.z; view.x1 = c.x + W / 2 / c.z; view.y0 = c.y - gy / c.z; view.y1 = c.y + (H - gy) / c.z;
    Draw.lod(c.z);
    if (HOR) { horizonScene(view); g.restore(); Draw.lod(1); return; }
    sky(view);
    heap.draw(g, view, T);
    ground(view);
    const t0 = performance.now();
    tool.draw(g, m);
    drawMs += performance.now() - t0; drawN++;
    parts.draw(g, view);
    if (q.get('debug')) {
      g.lineWidth = 4;
      for (const b of tool.bites(m)) { g.strokeStyle = b.active ? PAL.red : PAL.cream; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke(); }
      const s = tool.seat(m), d = tool.dump(m);
      g.strokeStyle = PAL.pink; g.beginPath(); g.arc(s.x, s.y, 10, 0, 7); g.stroke();
      g.strokeStyle = d.active ? PAL.gold : PAL.grayL; g.beginPath(); g.arc(d.x, d.y, 14, 0, 7); g.stroke();
    }
    g.restore(); Draw.lod(1);
    if (m.flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (m.flash * 0.75).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }
    if (m.speed.on) { g.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 14; i++) { const y = (i * 97 + 31) % H, x = ((i * 233 + T * 3000 * m.speed.dir) % W + W) % W; g.globalAlpha = m.speed.k * 0.6; g.fillRect(x - 120, y, 240, 2); } g.globalAlpha = 1; }
    Draw.text(g, 'Trem-Bala de Arroz (trembala) · ' + m.mode, 12, 22, { size: 16, align: 'left', col: PAL.cream, sw: 4 });
    Draw.text(g, m.phase + '  s ' + Math.round(m.s) + '  v ' + Math.round(m.v) + '  enchido ' + Math.round(m.fill * 100) + '%  cavado ' + Math.round(dug) + ' px²  zoom ' + c.z.toFixed(2),
      12, 40, { size: 10.5, align: 'left', col: PAL.goldL, sw: 3, weight: 700 });
    Draw.text(g, (E.Audio && E.Audio.ready ? (mute ? 'som: mudo (M)' : 'som: ligado (M = mudo)') : 'clique pra ligar o som'), W - 12, 22, { size: 12, align: 'right', col: PAL.cream, sw: 3, weight: 700 });
    if (logT > 0) Draw.text(g, log.join('  '), 12, 56, { size: 10.5, align: 'left', col: PAL.white, sw: 3, weight: 700 });
  }
  let frozen = false;
  const loop = E.Loop({ update: dt => { if (!frozen) update(dt); }, render, input });
  window.__demo = {
    m, tool, loop, stage, heap,
    step(sec) { frozen = true; const n = Math.round(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); render(); return true; },
    cost() { drawMs = 0; drawN = 0; for (let i = 0; i < 60; i++) render(); return +(drawMs / drawN).toFixed(3); },
  };
  if (q.has('t')) window.__demo.step(+q.get('t'));
  loop.start();
})();
</script>
</body>
</html>

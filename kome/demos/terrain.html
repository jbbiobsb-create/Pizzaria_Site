<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kome Engine · terrain.js (montanha de arroz)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1b18; overflow: hidden; }
</style>
</head>
<body>
<script src="../engine/core.js"></script>
<script src="../engine/pix.js"></script>
<script src="../engine/shiba.js"></script>
<script src="../engine/fx.js"></script>
<script src="../engine/terrain.js"></script>
<script>
/* Demo do terrain.js
   segure o ponteiro pra cavar · 1-5 ferramenta · R roda de caçambas · Z zoom · G devolver grãos · 0 reiniciar
   query: ?z=3|1|far  &x=<x de mundo>  &tool=1..5  &wheel=1  &dig=<segundos de cava automática antes do 1º frame> */
(function () {
  'use strict';
  const E = KomeEngine, U = E.U, D = E.Draw, C = E.PAL, TAU = Math.PI * 2;
  const W = 960, H = 540, INK = C.ink;
  const stage = E.Stage({ width: W, height: H, bg: '#9FD3E8', maxDpr: 2 });
  const g = stage.g;
  const input = E.Input(stage);
  const qs = k => { const m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : null; };

  /* ------------------------------------------------------------------
     Mundo: a montanha do GDD (2100 colunas de 4 px), camadas por profundidade, núcleo em elipse, 28 bolsões
     ------------------------------------------------------------------ */
  const WW = 8400, MX0 = 1800, MX1 = 8000, MH = 2400;
  const MATS = [
    { id: 'solto', name: 'Arroz Solto', d0: 0, d1: 150, hard: 1, val: 1, slope: 3.6, col: '#F6F1E4' },
    { id: 'prensado', name: 'Arroz Prensado', d0: 150, d1: 600, hard: 2.5, val: 1.6, slope: 6, col: '#E9DCBE' },
    { id: 'mochi', name: 'MOCHI DURO', d0: 600, d1: 1e9, hard: 8, val: 3.5, slope: 9, col: '#EFD9D2' },
    { id: 'koshi', name: 'Núcleo Koshihikari', ellipse: { cx: 4900, cy: 0, rx: 1150, ry: 900 }, hard: 24, val: 6, slope: 12, col: '#E8B93A' },
  ];
  const heap = E.Heap({ width: WW, colW: 4, layers: MATS });
  function shape(x) {
    if (x < MX0 || x > MX1) return 0;
    const u = (x - (MX0 + MX1) / 2) / ((MX1 - MX0) / 2);          // -1..1
    const tri = 1.02 - Math.sqrt(u * u + 0.012) - 0.02 * (1 - u * u) * 0;
    const foot = U.smooth(U.clamp((1 - Math.abs(u)) / 0.035, 0, 1)); // pé arredondado
    const bumps = 5 * Math.sin(x / 130) + 3 * Math.sin(x / 71 + 2) + 10 * Math.sin(x / 290 + 1);
    return Math.max(0, (MH * Math.max(0, tri) + bumps) * foot);
  }
  function build() {
    heap.clearPockets();
    heap.generate(shape);
    const r = E.RNG(77);
    let tries = 0;
    while (heap.pockets.length < 28 && tries++ < 400) {
      const x = MX0 + 200 + r() * (MX1 - MX0 - 400), rad = 35 + r() * 55, H0 = heap.h0[heap.col(x)];
      const y = H0 * (0.08 + r() * 0.84);
      if (H0 - y < 60 + rad * 0.3 || y < rad) continue;
      let ok = true;
      for (const p of heap.pockets) if (U.dist(p.x, p.y, x, y) < p.r + rad + 30) ok = false;
      if (ok) heap.addPocket({ x, y, r: rad, mult: 8 });
    }
  }
  build();

  const ps = E.Particles ? E.Particles(900) : null;
  const grains = E.Grains(ps, heap, { max: 900 });
  const kome = E.Actor({ x: 2010, y: 0, pose: 'stand', scale: 1 });
  kome.x = +(qs('x') || 2010);

  /* ------------------------------------------------------------------
     Estado da demo
     ------------------------------------------------------------------ */
  const TOOLS = [
    { r: 6, A: 90, pow: 1, name: 'Pata' }, { r: 11, A: 240, pow: 2, name: 'Pá' }, { r: 19, A: 560, pow: 3, name: 'Carrinho' },
    { r: 36, A: 1600, pow: 8, name: 'Escavadeira' }, { r: 72, A: 5200, pow: 16, name: 'Pá de cabo' },
  ];
  const ZOOMS = [{ z: 3, name: 'perto ×3' }, { z: 1, name: 'médio ×1' }, { z: 0.108, name: 'longe' }];
  const S = { tool: 1, wheel: false, zi: 0, redeposit: true, dug: 0, yen: 0, msg: '', msgT: 0, last: null, wheelRot: 0, wheelSpd: 0, bite: 0,
    msRelax: 0, msDraw: 0, emitAcc: 0, goldAcc: 0, digging: false, px: 0, py: 0 };
  const zq = qs('z'); if (zq) S.zi = zq === 'far' ? 2 : zq === '1' ? 1 : 0;
  if (qs('tool')) S.tool = U.clamp(+qs('tool') - 1, 0, 4);
  if (qs('wheel')) S.wheel = true;
  const cam = { x: kome.x, y: -60, z: ZOOMS[S.zi].z, ax: W / 2, ay: H * 0.62 };
  const view = { x0: 0, x1: 0, y0: 0, y1: 0 };
  function camTarget(out) {
    if (S.zi === 2) { out.x = (MX0 + MX1) / 2 - 150; out.y = -MH * 0.5 + 250; }
    else { out.x = kome.x; out.y = heap.surf(kome.x) - (S.zi === 0 ? 18 : 60); }
    return out;
  }
  { const t = camTarget({}); cam.x = t.x; cam.y = t.y; }

  // pilhas nos recipientes do painel
  const piles = [
    { name: 'Carrinho', pile: E.Pile({ cap: 2500, cols: 16, seed: 3 }), dump: 0, t: 0 },
    { name: 'Caçamba', pile: E.Pile({ cap: 30000, cols: 22, seed: 5, slope: 0.04 }), dump: 0, t: 0 },
    { name: 'Silo', pile: E.Pile({ cap: 400000, cols: 18, seed: 9, slope: 0.03, max: 1 }), dump: 0, t: 0 },
  ];
  piles[1].pile.set(0.35); piles[2].pile.set(0.4);

  /* ------------------------------------------------------------------
     Botões (desenhados no canvas, estilo Kome)
     ------------------------------------------------------------------ */
  const btns = [];
  function addBtn(id, x, y, w, h, label, fn, on) { btns.push({ id, x, y, w, h, label, fn, on, press: 0 }); }
  for (let i = 0; i < 5; i++) addBtn('t' + i, 14 + i * 40, H - 48, 36, 36, '', () => { S.tool = i; S.wheel = false; }, () => !S.wheel && S.tool === i);
  addBtn('wheel', 222, H - 48, 72, 36, 'Roda', () => { S.wheel = !S.wheel; }, () => S.wheel);
  addBtn('zoom', 302, H - 48, 112, 36, () => 'Zoom: ' + ZOOMS[S.zi].name, () => { S.zi = (S.zi + 1) % 3; });
  addBtn('redep', 422, H - 48, 132, 36, () => 'Devolver grãos: ' + (S.redeposit ? 'sim' : 'não'), () => { S.redeposit = !S.redeposit; }, () => S.redeposit);
  addBtn('reset', 562, H - 48, 84, 36, 'Reiniciar', () => { build(); grains.clear(); S.dug = S.yen = 0; });
  function btnAt(x, y) { for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; return null; }
  let uiHold = false;
  input.on('down', (x, y) => { const b = btnAt(x, y); uiHold = !!b; if (b) { b.fn(); b.press = 1; } });
  input.on('up', () => { uiHold = false; });
  input.on('key', code => {
    if (code >= 'Digit1' && code <= 'Digit5') { S.tool = +code.slice(5) - 1; S.wheel = false; }
    else if (code === 'KeyR') S.wheel = !S.wheel;
    else if (code === 'KeyZ') S.zi = (S.zi + 1) % 3;
    else if (code === 'KeyG') S.redeposit = !S.redeposit;
    else if (code === 'Digit0') { build(); grains.clear(); }
  });

  /* ------------------------------------------------------------------
     Simulação
     ------------------------------------------------------------------ */
  const tmp = { x: 0, y: 0 };
  function feedPiles(v) {
    for (const p of piles) if (!p.dump) p.pile.add(v, 0.5 + 0.22 * Math.sin(p.t * 2.3 + p.pile.cap), 0.14);
  }
  // um passo de cava no ponto (wx, wy) do mundo
  function digAt(wx, wy, dt) {
    let res;
    if (S.wheel) {
      const r = wheelR();
      S.wheelSpd = U.damp(S.wheelSpd, 1, 2.2, dt);
      S.bite = heap.bite(wx, wy, r, -1);
      res = heap.digCircle(wx, wy, r, 9000 * (r / 110) * (r / 110) * S.wheelSpd * dt, { pow: 24 });
      if (res.fell > 0 && Math.random() < 0.6) grains.emit(wx + U.rnd(-r, r) * 0.7, wy - r * 0.6, 2, { vx: 0, vy: 30, spread: 50, internal: true, size: r > 60 ? 2.2 : 1 });
    } else {
      const t = TOOLS[S.tool];
      res = heap.dig(wx, t.A * dt, t.r, { pow: t.pow });
    }
    if (res.got > 0) {
      S.dug += res.got; S.yen += res.val * 0.2;
      const back = S.redeposit ? 0.45 : 0;
      feedPiles(res.got * (1 - back));
      // grãos: uns voam e voltam pra montanha (deposit), outros são só enfeite
      const far = cam.z < 0.5, per = far ? 260 : S.zi === 1 ? 26 : 5;
      S.emitAcc += res.got / per;
      let nE = Math.min(14, S.emitAcc | 0); S.emitAcc -= nE; if (S.emitAcc > 20) S.emitAcc = 20;
      const r = S.wheel ? wheelR() : TOOLS[S.tool].r, sy = heap.surf(wx), dir = kome.face || 1;
      const sp = far ? 520 : S.zi === 1 ? 250 : 150, sz = far ? 7 : S.zi === 1 ? 1.7 : 1;
      if (nE > 0) {
        const nd = back > 0 ? Math.max(1, Math.round(nE * 0.6)) : 0;
        if (nd) grains.emit(wx, sy - 2, nd, { vx: -dir * sp * 0.55, vy: -sp * 1.25, spread: sp * 0.7, deposit: true, vol: res.got * back * (nE / Math.max(nE, res.got / per)), size: sz });
        if (nE - nd > 0) grains.emit(wx + U.rnd(-r, r) * 0.5, sy - 2, nE - nd, { vx: dir * sp * 0.3, vy: -sp, spread: sp * 0.9, size: sz, gold: res.gold > 0 && Math.random() < 0.7 });
      } else if (back > 0) heap.add(wx - dir * r * 1.6, res.got * back, r);
      if (res.gold > 0 && !far) { S.goldAcc += res.gold / 14; const ng = Math.min(6, S.goldAcc | 0); S.goldAcc -= ng; if (ng) grains.emit(wx, sy - 3, ng, { vy: -sp * 1.3, spread: sp, gold: true, internal: true, size: sz * 1.2 }); }
      if (res.pocket && res.pocket.flash > 0.95) { S.msg = 'BOLSÃO DOURADO! ×' + res.pocket.mult; S.msgT = 2.2; if (ps) ps.burst(res.pocket.x, heap.y0 - res.pocket.y, 26, { c: [C.gold, C.goldL, '#FFFFFF'], shape: 'star', speed: 260 * Math.max(1, 0.5 / cam.z), w: 6 * Math.max(1, 0.6 / cam.z), life: 0.9 }); }
    }
    if (res.blocked > 0 && res.got < res.blocked * 0.2 && res.hardMat) {
      if (S.msgT <= 0.3) { S.msg = 'Duro demais! ' + res.hardMat.name + ' pede mais força'; S.msgT = 1.4; kome.say('duro demais!', 1.2); kome.hop(60); }
    }
    S.last = res;
  }
  function wheelR() { return S.zi === 0 ? 30 : S.zi === 1 ? 70 : 110; }

  function update(dt, auto) {
    const z = cam.z;
    let down = input.down && !uiHold, sx = input.x, sy = input.y;
    let wx = cam.x + (sx - cam.ax) / z, wy = cam.y + (sy - cam.ay) / z;
    if (auto) { down = true; wx = auto.x; wy = auto.y !== undefined ? auto.y : heap.surf(auto.x) + 4; }
    S.px = wx; S.py = wy; S.digging = down;

    // Kome corre até o lado do ponto de cava
    const reach = (S.wheel ? wheelR() : TOOLS[S.tool].r) * 0.6 + 14;
    const tx = down ? wx - reach * (wx >= kome.x ? 1 : -1) : kome.x, dxk = tx - kome.x;
    const sp = z < 0.5 ? 1400 : 260;
    kome.vx = Math.abs(dxk) > 3 ? U.clamp(dxk * 6, -sp, sp) : 0;
    kome.x = U.clamp(kome.x + 0, 40, WW - 40);
    if (down) {
      digAt(wx, wy, dt);
      kome.face = wx >= kome.x ? 1 : -1;
      kome.pose = Math.abs(kome.vx) > 60 ? 'run' : 'dig';
    } else {
      kome.pose = Math.abs(kome.vx) > 60 ? 'run' : 'stand';
      S.wheelSpd = U.damp(S.wheelSpd, 0, 1.5, dt);
    }
    S.wheelRot += S.wheelSpd * dt * 2.4;
    kome.update(dt);
    kome.y = U.damp(kome.y, heap.surf(kome.x), 22, dt);

    const t0 = performance.now();
    heap.relax(dt);
    S.msRelax += (performance.now() - t0 - S.msRelax) * 0.06;
    grains.update(dt);
    if (ps) ps.update(dt, grains.floor);

    for (const p of piles) {
      p.t += dt;
      const pl = p.pile;
      if (!p.dump && pl.frac >= (p.name === 'Silo' ? 0.97 : 1.12)) p.dump = 1;
      if (p.dump) { pl.tilt = U.damp(pl.tilt, 1, 5, dt); pl.take(pl.cap * dt * 1.3, 0.92); if (pl.v <= pl.cap * 0.01) { pl.clear(); p.dump = 0; } }
      else pl.tilt = U.damp(pl.tilt, 0, 6, dt);
      pl.update(dt);
    }
    if (S.msgT > 0) S.msgT -= dt;

    // câmera
    if (S.free) { cam.x = S.free.x; cam.y = S.free.y; cam.z = S.free.z; return; } // câmera livre (screenshots): demo.S.free = {x,y,z}
    const tz = ZOOMS[S.zi].z, tg = camTarget(tmp);
    cam.z = Math.exp(U.damp(Math.log(cam.z), Math.log(tz), 5, dt));
    cam.x = U.damp(cam.x, tg.x, 5, dt); cam.y = U.damp(cam.y, tg.y, 5, dt);
  }

  /* ------------------------------------------------------------------
     Desenho
     ------------------------------------------------------------------ */
  function sky(t) {
    const bands = ['#8CC8E2', '#9FD3E8', '#B5DEEC', '#CBE8EE', '#E2EFE6', '#F4EBD2'];
    for (let i = 0; i < bands.length; i++) { g.fillStyle = bands[i]; g.fillRect(0, (H * 0.78 * i) / bands.length, W, H); }
    // sol com halo chapado
    g.fillStyle = 'rgba(255,250,230,.35)'; g.beginPath(); g.arc(760, 96, 62 + Math.sin(t * 0.8) * 2, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,250,230,.5)'; g.beginPath(); g.arc(760, 96, 44, 0, TAU); g.fill();
    g.fillStyle = '#FFF3C4'; g.beginPath(); g.arc(760, 96, 30, 0, TAU); g.fill();
    // nuvens gordinhas andando
    for (let i = 0; i < 5; i++) {
      const x = ((i * 260 + t * (6 + i * 2) - cam.x * 0.02) % (W + 300) + W + 300) % (W + 300) - 150, y = 50 + ((i * 53) % 110), s = 0.7 + (i % 3) * 0.25;
      g.fillStyle = 'rgba(255,255,255,.85)';
      g.beginPath(); g.ellipse(x, y, 46 * s, 13 * s, 0, 0, TAU); g.ellipse(x - 18 * s, y - 8 * s, 20 * s, 13 * s, 0, 0, TAU); g.ellipse(x + 12 * s, y - 11 * s, 24 * s, 16 * s, 0, 0, TAU); g.fill();
    }
    // morros distantes com parallax (mais claros e azulados = névoa de distância)
    const hills = [[0.05, '#BFD9D6', 0.74, 60], [0.12, '#A6C9B4', 0.8, 46], [0.25, '#8DB58E', 0.86, 34]];
    for (const [f, col, base, amp] of hills) {
      const gy = cam.ay + (0 - cam.y) * cam.z * f * 0.4 + (base - 0.62) * H * (1 - f);
      g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 16) { const wx = x + cam.x * f * cam.z * 0.5; g.lineTo(x, Math.min(H, gy) - amp * (0.5 + 0.5 * Math.sin(wx / 140 + f * 30) + 0.3 * Math.sin(wx / 53 + f * 9))); }
      g.lineTo(W, H); g.fill();
    }
  }
  function ground(t) {
    // chão na frente da base: grama + terra (cobre o pé da montanha)
    const x0 = view.x0 - 10, w = view.x1 - view.x0 + 20, lw = 1.25 / Math.min(1, cam.z);
    g.fillStyle = C.woodD; g.fillRect(x0, 0, w, (view.y1 > 0 ? view.y1 : 0) + 10);
    g.fillStyle = C.grassD; g.fillRect(x0, 0, w, Math.max(7, 5 / cam.z));
    g.fillStyle = C.grass; g.fillRect(x0, 0, w, Math.max(4, 3 / cam.z));
    g.fillStyle = C.line; g.fillRect(x0, -lw * 0.5, w, lw);
    if (cam.z > 0.6) { // tufos de grama balançando fora da montanha
      g.strokeStyle = C.grassD; g.lineWidth = 1; g.lineCap = 'round'; g.beginPath();
      for (let x = Math.floor(view.x0 / 9) * 9; x < view.x1; x += 9) {
        if (heap.height(x) > 0.5) continue;
        const hh = 3 + E.hash(x) * 4, sw = Math.sin(t * 2 + x * 0.05) * 1.6;
        g.moveTo(x, 0); g.quadraticCurveTo(x + sw * 0.4, -hh * 0.6, x + sw, -hh);
      }
      g.stroke();
    }
  }
  function drawWheel(t) {
    const r = wheelR(), x = S.px, y = S.py, ol = Math.max(1.6, 1.4 / cam.z), nb = 12;
    g.save(); g.translate(x, y);
    // lança (treliça) saindo pra direita
    D.lod(cam.z);
    D.truss(g, [r * 0.1, 0], [r * 4.2, -r * 1.3], r * 0.5, r * 0.07, C.yel, { taper: 1.3, cross: true, ol });
    g.rotate(S.wheelRot + Math.sin(t * 40) * 0.004 * S.wheelSpd);
    for (let i = 0; i < nb; i++) { // caçambas
      const a = (i / nb) * TAU;
      g.save(); g.rotate(a); g.translate(r * 0.86, 0);
      D.poly(g, [[-r * 0.04, -r * 0.14], [r * 0.16, -r * 0.1], [r * 0.2, r * 0.1], [-r * 0.04, r * 0.16]], C.red, { ol, shade: C.redD });
      g.fillStyle = C.rice; g.fillRect(r * 0.0, -r * 0.1, r * 0.1, r * 0.06);
      g.restore();
    }
    D.ring(g, 0, 0, r * 0.86, r * 0.1, C.yel, { ol });
    g.strokeStyle = C.line; g.lineWidth = ol * 2 + r * 0.045; g.lineCap = 'round';
    g.beginPath(); for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; g.moveTo(0, 0); g.lineTo(Math.cos(a) * r * 0.76, Math.sin(a) * r * 0.76); } g.stroke();
    g.strokeStyle = C.yelD; g.lineWidth = r * 0.045;
    g.beginPath(); for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; g.moveTo(0, 0); g.lineTo(Math.cos(a) * r * 0.76, Math.sin(a) * r * 0.76); } g.stroke();
    D.circle(g, 0, 0, r * 0.2, C.steel, { ol });
    g.restore();
    // medidor da mordida em arco
    const b = S.bite, good = b >= 0.4 && b <= 0.7;
    g.lineCap = 'round';
    g.strokeStyle = C.line; g.lineWidth = Math.max(5, 5 / cam.z); g.beginPath(); g.arc(x, y, r * 1.22, Math.PI * 0.75, Math.PI * 1.75); g.stroke();
    g.strokeStyle = good ? C.gold : C.cream; g.lineWidth = Math.max(2.6, 2.6 / cam.z); g.beginPath(); g.arc(x, y, r * 1.22, Math.PI * 0.75, Math.PI * (0.75 + Math.max(0.01, b))); g.stroke();
    D.text(g, (good ? 'MORDIDA PERFEITA ' : 'mordida ') + Math.round(b * 100) + '%', x, y - r * 1.5, { size: Math.max(9, 11 / cam.z), col: good ? C.goldL : C.cream, sw: Math.max(3, 3 / cam.z) });
  }
  function drawCursor(t) {
    if (S.wheel) return;
    const tl = TOOLS[S.tool], x = S.px, y = heap.surf(x);
    const lw = Math.max(0.8, 1.5 / cam.z), pulse = 1 + Math.sin(t * 6) * 0.06;
    g.strokeStyle = 'rgba(59,40,24,.8)'; g.lineWidth = lw * 2.2; g.setLineDash([lw * 3, lw * 3]); g.lineDashOffset = -t * 14 * lw;
    g.beginPath(); g.ellipse(x, y, tl.r * pulse, tl.r * 0.35 * pulse, 0, 0, TAU); g.stroke();
    g.strokeStyle = C.cream; g.lineWidth = lw; g.stroke();
    g.setLineDash([]);
  }

  function panel(x, y, w, h, title) {
    g.fillStyle = 'rgba(42,26,16,.22)'; D.rrect(g, x + 2, y + 4, w, h, 9); g.fill();
    g.fillStyle = INK; D.rrect(g, x - 2, y - 2, w + 4, h + 4, 10); g.fill();
    g.fillStyle = C.cream; D.rrect(g, x, y, w, h, 8); g.fill();
    if (title) { g.fillStyle = INK; D.rrect(g, x, y, w, 19, 8); g.fill(); g.fillRect(x, y + 9, w, 10); D.text(g, title, x + 9, y + 10, { size: 11, col: C.gold, sw: 0, align: 'left' }); }
  }
  const TXT = { size: 11, col: INK, sw: 0, weight: 800, align: 'left' };
  const TXTR = { size: 11, col: INK, sw: 0, weight: 900, align: 'right' };
  function hud(t) {
    D.lod(1);
    // medidores
    panel(12, 12, 208, 132, 'KOME ENGINE · terrain.js');
    const rows = [
      ['FPS', loop.fps.toFixed(0)], ['relax()', S.msRelax.toFixed(2) + ' ms'], ['draw()', S.msDraw.toFixed(2) + ' ms'],
      ['colunas', heap.n + (heap.moving ? ' · escorrendo' : ' · parada')], ['resta', (heap.frac() * 100).toFixed(2) + '%'],
      ['grãos no ar', String(grains.count + (ps ? ps.count || 0 : 0))], ['¥', U.fmt(S.yen)],
    ];
    rows.forEach((r, i) => { D.text(g, r[0], 22, 42 + i * 14.5, TXT); D.text(g, r[1], 210, 42 + i * 14.5, TXTR); });
    // última cava por material
    panel(12, 152, 208, 78, 'Material na pata');
    const top = heap.topMat(S.px);
    g.fillStyle = INK; D.rrect(g, 21, 177, 18, 18, 4); g.fill(); g.fillStyle = top.col; D.rrect(g, 23, 179, 14, 14, 3); g.fill();
    D.text(g, top.name, 45, 187, TXT);
    D.text(g, 'dureza ' + top.hard + ' · valor ×' + top.val + ' · talude ' + top.slope, 22, 205, { size: 9.5, col: '#6B5540', sw: 0, weight: 700, align: 'left' });
    const tl = S.wheel ? { pow: 24, name: 'Roda de caçambas' } : TOOLS[S.tool];
    const k = tl.pow / top.hard;
    D.text(g, tl.name + ': ' + (k >= 1 ? '100%' : k >= heap.minK ? Math.round(k * 100) + '%' : 'boing!'), 22, 219, { size: 9.5, col: k < heap.minK ? C.red : '#6B5540', sw: 0, weight: 800, align: 'left' });

    // recipientes com E.Pile
    panel(W - 318, 12, 306, 124, 'E.Pile · pilha que assenta');
    const bx = W - 318;
    { // carrinho de mão
      const p = piles[0], cx = bx + 54, by = 104, tilt = p.pile.tilt * 0.5;
      g.save(); g.translate(cx + 30, by + 4); g.rotate(tilt); g.translate(-(cx + 30), -(by + 4));
      g.save(); g.beginPath(); g.moveTo(cx - 36, by - 52); g.lineTo(cx + 40, by - 52); g.lineTo(cx + 40, by - 30); g.lineTo(cx + 26, by); g.lineTo(cx - 26, by); g.lineTo(cx - 36, by - 30); g.closePath(); g.clip();
      p.pile.draw(g, cx, by - 2, 70, 30);
      g.restore();
      D.poly(g, [[cx - 38, by - 30], [cx + 40, by - 30], [cx + 26, by + 2], [cx - 26, by + 2]], C.red, { ol: 2, shade: C.redD });
      g.fillStyle = C.redL; g.fillRect(cx - 33, by - 28, 68, 3);
      D.beam(g, [[cx - 30, by - 4], [cx - 52, by - 20]], 3.5, C.wood, { ol: 1.6 });
      g.restore();
      D.wheel(g, cx + 30, by + 12, 10, t * (p.dump ? 6 : 0.4), { hub: C.steel, spokes: 4, ol: 1.6 });
      D.text(g, p.name, cx, 127, { size: 9.5, col: INK, sw: 0, weight: 800 });
    }
    { // caçamba de caminhão
      const p = piles[1], cx = bx + 156, by = 106, tilt = -p.pile.tilt * 0.42;
      g.save(); g.translate(cx - 44, by + 2); g.rotate(tilt); g.translate(-(cx - 44), -(by + 2));
      g.save(); g.beginPath(); g.rect(cx - 44, by - 70, 88, 70); g.clip();
      p.pile.draw(g, cx, by - 2, 84, 26);
      g.restore();
      D.box(g, cx - 46, by - 22, 92, 24, C.yel, { ol: 2, panels: 4, rivets: true });
      D.poly(g, [[cx + 46, by - 22], [cx + 62, by - 34], [cx + 62, by - 29], [cx + 46, by - 14]], C.yelD, { ol: 2 });
      g.restore();
      D.wheel(g, cx - 26, by + 9, 9, t * 0.5, { ol: 1.6 }); D.wheel(g, cx + 26, by + 9, 9, t * 0.5, { ol: 1.6 });
      D.text(g, p.name + ' ' + Math.round(p.pile.frac * 100) + '%', cx, 127, { size: 9.5, col: p.pile.frac >= 1 ? C.oraD : INK, sw: 0, weight: 800 });
    }
    { // visor do silo
      const p = piles[2], cx = bx + 256, cy = 72, r = 30;
      D.box(g, cx - 40, 36, 80, 78, C.steel, { ol: 2, panels: 3, rivets: true });
      g.fillStyle = INK; g.beginPath(); g.arc(cx, cy, r + 5, 0, TAU); g.fill();
      g.fillStyle = '#3F4A52'; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
      g.save(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.clip();
      p.pile.draw(g, cx, cy + r, r * 2, r * 2 * 0.92);
      g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath(); g.ellipse(cx - 10, cy - 13, 13, 6, -0.6, 0, TAU); g.fill();
      g.restore();
      D.ring(g, cx, cy, r + 5, 5, C.steelD, { ol: 0 });
      D.text(g, p.name, cx, 127, { size: 9.5, col: INK, sw: 0, weight: 800 });
    }
    // grãos caindo nos recipientes enquanto cava
    if (S.digging && S.last && S.last.got > 0) {
      g.fillStyle = C.rice; g.strokeStyle = C.line; g.lineWidth = 0.8;
      for (let i = 0; i < 9; i++) {
        const k = i % 3, f = (t * 2.6 + i * 0.37) % 1, x = bx + [54, 156, 256][k] + Math.sin(i * 9.1) * 7 + 14 * Math.sin(piles[k].t * 2.3 + piles[k].pile.cap) * (k < 2 ? 1 : 0.4), y = 34 + f * f * [34, 40, 30][k];
        g.beginPath(); g.ellipse(x, y, 2.4, 1.1, f * 8 + i, 0, TAU); g.stroke(); g.fill();
      }
    }

    // botões
    for (const b of btns) {
      b.press = Math.max(0, b.press - 0.12);
      const on = b.on && b.on(), oy = b.press * 2;
      g.fillStyle = INK; D.rrect(g, b.x - 2, b.y - 2 + 3, b.w + 4, b.h + 4, 9); g.fill();
      g.fillStyle = INK; D.rrect(g, b.x - 2, b.y - 2 + oy, b.w + 4, b.h + 4, 9); g.fill();
      g.fillStyle = on ? C.gold : C.cream; D.rrect(g, b.x, b.y + oy, b.w, b.h, 7); g.fill();
      g.fillStyle = on ? C.goldL : '#FFFFFF'; D.rrect(g, b.x + 3, b.y + 2 + oy, b.w - 6, 4, 2); g.fill();
      if (b.id[0] === 't' && b.id.length === 2) {
        const i = +b.id[1], rr = 3 + i * 2.6;
        g.fillStyle = INK; g.beginPath(); g.arc(b.x + b.w / 2, b.y + b.h / 2 + 1 + oy, rr + 1.6, 0, TAU); g.fill();
        g.fillStyle = C.rice; g.beginPath(); g.arc(b.x + b.w / 2, b.y + b.h / 2 + 1 + oy, rr, 0, TAU); g.fill();
        D.text(g, String(i + 1), b.x + 8, b.y + 9 + oy, { size: 9, col: INK, sw: 0 });
      } else D.text(g, typeof b.label === 'function' ? b.label() : b.label, b.x + b.w / 2, b.y + b.h / 2 + 1 + oy, { size: 11, col: INK, sw: 0, weight: 900 });
    }
    D.text(g, 'segure pra cavar · 1-5 ferramenta · R roda · Z zoom · G devolver · 0 reiniciar', W - 12, H - 14, { size: 10, col: C.cream, sw: 3, align: 'right', weight: 800 });
    if (S.msgT > 0) {
      const a = Math.min(1, S.msgT * 3), pop = 1 + Math.max(0, S.msgT - 1.9) * 1.2;
      D.text(g, S.msg, W / 2, 190, { size: 22 * pop, col: S.msg[0] === 'B' ? C.goldL : C.cream, sw: 6, alpha: a, shadow: 3 });
    }
  }

  const drawOpts = { haze: null, pockets: 'all' };
  const hazeFar = { col: '#BFE2EE', a0: 0, a1: 0.2 };
  function render() {
    const t = loop.time, z = cam.z;
    stage.begin();
    sky(t);
    g.save();
    g.translate(cam.ax, cam.ay); g.scale(z, z); g.translate(-cam.x, -cam.y);
    view.x0 = cam.x - cam.ax / z; view.x1 = cam.x + (W - cam.ax) / z; view.y0 = cam.y - cam.ay / z; view.y1 = cam.y + (H - cam.ay) / z;
    D.lod(z);
    drawOpts.haze = z < 0.3 ? hazeFar : null;
    const t0 = performance.now();
    heap.draw(g, view, t, drawOpts);
    S.msDraw += (performance.now() - t0 - S.msDraw) * 0.06;
    ground(t);
    if (S.wheel) drawWheel(t);
    kome.draw(g);
    grains.draw(g, view);
    if (ps) ps.draw(g);
    drawCursor(t);
    g.restore();
    hud(t);
  }

  const loop = E.Loop({ update: dt => update(dt), render, input });
  // cava automática antes do primeiro frame (pra screenshots): ?dig=segundos
  function sim(x, secs, y) { for (let i = 0; i < secs * 60; i++) update(1 / 60, { x, y }); }
  if (qs('dig')) sim(+(qs('x') || 2010) + 40, +qs('dig'));
  window.demo = { E, heap, cam, S, kome, grains, piles, sim, loop,
    setZoom(i) { S.zi = i; cam.z = ZOOMS[i].z; const tg = camTarget({}); cam.x = tg.x; cam.y = tg.y; },
    look(x) { kome.x = x; kome.y = heap.surf(x); const tg = camTarget({}); cam.x = tg.x; cam.y = tg.y; } };
  heap.prewarm(g);
  loop.start();
})();
</script>

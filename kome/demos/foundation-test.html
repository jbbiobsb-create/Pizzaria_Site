<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kome Engine · teste da fundação (core + pix + shiba)</title>
<style>
  html, body { margin: 0; height: 100%; background: #3B2818; overflow: hidden; }
  .ft-list {
    position: absolute; left: 12px; top: 44px; width: 590px; height: 486px; overflow: hidden;
    columns: 3; column-gap: 8px; column-fill: auto; font: 700 7.5px/1.3 'Zen Maru Gothic', 'Trebuchet MS', system-ui, sans-serif; color: #3B2818;
  }
  .ft-list div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; break-inside: avoid; }
  .ft-list .ok::before { content: '● '; color: #6FA84B; }
  .ft-list .bad { color: #B3261E; white-space: normal; font-weight: 900; }
  .ft-list .bad::before { content: '✖ '; }
  .ft-list .sec { font-weight: 900; margin-top: 3px; color: #A8650A; }
</style>
</head>
<body>
<script src="../engine/core.js"></script>
<script src="../engine/pix.js"></script>
<script src="../engine/shiba.js"></script>
<script>
/* ============================================================================
   Teste de conformidade da fundação da Kome Engine.
   Confere cada item das seções core/pix/shiba do ENGINE_CONTRACT.md (existência +
   comportamento) e caça bugs de borda. Loga "[kome] foundation: PASS/FAIL nome".
   Rodar:  node kome/tools/shot.js kome/demos/foundation-test.html saida.png --wait 6000
   Opções: ?quick=1 pula o teste longo de cache (20 s simulados com 100 atores).
   ============================================================================ */
(async function () {
  'use strict';
  const E = KomeEngine, U = E.U, Draw = E.Draw, PAL = E.PAL;
  const q = new URLSearchParams(location.search);

  /* ---------- mini framework ---------- */
  const results = [];
  let section = '';
  function sec(name) { section = name; results.push({ sec: name }); }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'falhou'); }
  function eq(a, b, msg) { if (a !== b) throw new Error((msg || 'esperava') + ': ' + JSON.stringify(b) + ', veio ' + JSON.stringify(a)); }
  function near(a, b, eps, msg) { if (!(Math.abs(a - b) <= (eps === undefined ? 1e-6 : eps))) throw new Error((msg || 'esperava ~') + b + ', veio ' + a); }
  function isFn(o, names, where) { names.split(' ').forEach(n => { if (typeof o[n] !== 'function') throw new Error((where || '') + '.' + n + ' não é função'); }); }
  function has(o, names, where) { names.split(' ').forEach(n => { if (!(n in o)) throw new Error((where || '') + '.' + n + ' não existe'); }); }
  async function T(name, fn) {
    let pass = true, err = '';
    try { await fn(); } catch (e) { pass = false; err = e && e.message ? e.message : String(e); }
    results.push({ name: section + ' · ' + name, pass, err });
    console.log('[kome] foundation: ' + (pass ? 'PASS ' : 'FAIL ') + section + ' · ' + name + (pass ? '' : ' — ' + err));
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const data = cv => { const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; const g = t.getContext('2d', { willReadFrequently: true }); g.drawImage(cv, 0, 0); return g.getImageData(0, 0, t.width, t.height).data; };
  function count(cv) { const d = data(cv); let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i]) n++; return n; }
  function bbox(cv) {
    const d = data(cv), w = cv.width, h = cv.height; let x0 = w, x1 = -1, y0 = h, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { x0, x1, y0, y1 };
  }
  function same(a, b) { const da = data(a), db = data(b); if (da.length !== db.length) return false; for (let i = 0; i < da.length; i++) if (da[i] !== db[i]) return false; return true; }
  function px(cv, x, y) { const d = data(cv), i = (y * cv.width + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; }

  /* ---------- palco principal (windowed, contain) ---------- */
  const stage = E.Stage({ width: 960, height: 540, bg: '#FFF6DC', maxDpr: 2 });
  const input = E.Input(stage);
  window.FT = { stage, input, taps: [], results };
  input.on('tap', (x, y) => FT.taps.push([Math.round(x), Math.round(y)]));

  /* ==========================================================================
     CORE
     ========================================================================== */
  sec('core');
  await T('E.version', () => eq(E.version, '1.0.0'));
  await T('U existe (todas as funções do contrato)', () => {
    isFn(U, 'clamp lerp invLerp remap smooth damp sign dist angLerp rnd irnd pick chance shuffle fmt fmtTime hex rgba css mix mixCss shade', 'U');
    near(U.TAU, Math.PI * 2);
    isFn(U.ease, 'lin in out inOut back backIn elastic bounce quadIn quadOut expoOut sine', 'U.ease');
  });
  await T('U math', () => {
    eq(U.clamp(5, 0, 3), 3); eq(U.clamp(-1, 0, 3), 0); eq(U.lerp(2, 4, .5), 3); eq(U.invLerp(2, 4, 3), .5); eq(U.invLerp(2, 2, 3), 0);
    eq(U.remap(5, 0, 10, 100, 200), 150); eq(U.smooth(.5), .5); eq(U.smooth(-1), 0); eq(U.smooth(9), 1);
    eq(U.sign(-4), -1); eq(U.sign(0), 0); eq(U.dist(0, 0, 3, 4), 5);
    // damp independente de fps: 1 passo de dt == 2 passos de dt/2
    const a = U.damp(0, 10, 6, .1), b = U.damp(U.damp(0, 10, 6, .05), 10, 6, .05); near(a, b, 1e-9, 'damp fps');
    near(U.damp(3, 10, 6, 0), 3);
    // angLerp pelo caminho curto, inclusive com voltas a mais
    near(Math.cos(U.angLerp(3, -3, .5)), -1, .01); near(U.angLerp(0, U.TAU * 3 + .2, 1), .2, 1e-9); near(U.angLerp(.1, -.1, .5), 0, 1e-9);
  });
  await T('U aleatório', () => {
    for (let i = 0; i < 500; i++) {
      const a = U.rnd(2, 3), b = U.irnd(1, 6); ok(a >= 2 && a < 3, 'rnd'); ok(b >= 1 && b <= 6 && b === Math.floor(b), 'irnd');
    }
    const seen = {}; for (let i = 0; i < 400; i++) seen[U.irnd(1, 3)] = 1; ok(seen[1] && seen[2] && seen[3], 'irnd inclusivo');
    const src = [1, 2, 3, 4, 5, 6], arr = U.shuffle(src); ok(arr === src, 'shuffle devolve o mesmo array'); eq(arr.slice().sort().join(''), '123456');
    ok([7, 8].indexOf(U.pick([7, 8])) >= 0); ok(U.chance(1) && !U.chance(0));
  });
  await T('U.ease: 0→0, 1→1, monotonia das simples', () => {
    'lin in out inOut back backIn elastic bounce quadIn quadOut expoOut sine'.split(' ').forEach(k => {
      near(U.ease[k](0), 0, 1e-3, k + '(0)'); near(U.ease[k](1), 1, 1e-3, k + '(1)');
      for (let i = 0; i <= 20; i++) ok(isFinite(U.ease[k](i / 20)), k + ' finito');
    });
    'lin in out inOut quadIn quadOut expoOut sine'.split(' ').forEach(k => { let p = -1; for (let i = 0; i <= 50; i++) { const v = U.ease[k](i / 50); ok(v >= p - 1e-9, k + ' monótona'); p = v; } });
    ok(U.ease.back(.6) > 1, 'back passa do alvo'); ok(U.ease.backIn(.3) < 0, 'backIn recua');
  });
  await T('U.fmt pt-BR', () => {
    const c = { 0: '0', 7: '7', 999: '999', 1234: '1.234', 9999: '9.999', 10000: '10,0 mil', 12345: '12,3 mil', 123456: '123 mil', 4560000: '4,56 mi',
      2.3e9: '2,30 bi', 7.7e12: '7,70 tri', 1e15: '1,00 quatri', 1e18: '1,00 quinti', 1e21: '1,00 sexti', 1e24: '1,00 septi', 1e27: '1,00 octi', 1e30: '1,00 noni', 1e33: '1,00 deci' };
    for (const k in c) eq(U.fmt(+k), c[k], 'fmt(' + k + ')');
    eq(U.fmt(999999), '1,00 mi'); eq(U.fmt(99999), '100 mil'); eq(U.fmt(9999999), '10,0 mi'); eq(U.fmt(999.9), '999');
    ok(typeof U.fmt(1e40) === 'string' && U.fmt(1e40).length < 12, 'acima de deci'); eq(U.fmt(NaN), '0'); eq(U.fmt(-1500), '-1.500'); eq(U.fmt('1234'), '1.234');
    ok(typeof U.fmt(Infinity) === 'string' && typeof U.fmt(undefined) === 'string');
    // nunca "1000 mil" nem 4+ dígitos antes do sufixo, em nenhuma fronteira
    for (let e = 4; e < 36; e++) for (const m of [0.9994, 0.9995, 0.99999, 1, 9.994, 9.995, 9.9999, 99.94, 99.95, 99.999, 999.4, 999.5, 999.99]) {
      const s = U.fmt(m * Math.pow(10, e)); ok(/^(\d{1,3}(,\d{1,2})? [a-z]+|\d\.\d{3}|\d,\d\de\d+)$/.test(s), 'formato ruim: ' + s + ' (' + m + 'e' + e + ')');
    }
  });
  await T('U.fmtTime', () => { eq(U.fmtTime(45), '45s'); eq(U.fmtTime(200), '3min 20s'); eq(U.fmtTime(3720), '1h 02min'); eq(U.fmtTime(0), '0s'); eq(U.fmtTime(59.9), '59s'); eq(U.fmtTime(-5), '0s'); ok(typeof U.fmtTime(NaN) === 'string'); });
  await T('U cores (hex/rgba/css/mix/mixCss/shade)', () => {
    eq(U.hex('#E3BC62').join(), '227,188,98,255'); eq(U.hex('#fff').join(), '255,255,255,255'); eq(U.hex('E3BC62').join(), '227,188,98,255');
    eq(U.rgba('#ff0000', .5), 'rgba(255,0,0,0.5)'); eq(U.rgba([1, 2, 3, 255], .25), 'rgba(1,2,3,0.25)');
    eq(U.css('#abc'), '#abc'); eq(U.css([255, 0, 16, 255]).toLowerCase(), '#ff0010'); ok(/^rgba\(/.test(U.css([1, 2, 3, 128])));
    eq(U.mix('#000000', '#ffffff', .5).join(), '128,128,128,255'); eq(U.mix([0, 0, 0, 255], [10, 20, 30, 255], 1).join(), '10,20,30,255');
    eq(U.mixCss('#000000', '#ffffff', 0).toLowerCase(), '#000000'); eq(U.mixCss('#000000', '#ffffff', 1).toLowerCase(), '#ffffff');
    const d = U.hex(U.shade('#808080', -.5)), l = U.hex(U.shade('#808080', .5)); ok(d[0] < 128 && l[0] > 128, 'shade direção'); ok(d[0] > d[2], 'sombra puxa pro marrom'); eq(U.shade('#808080', 0).toLowerCase(), '#808080');
    eq(U.hex(U.shade([128, 128, 128, 255], -1)).join(), '40,20,8,255');
    // canvas aceita as strings devolvidas
    const g = mk(2, 2).getContext('2d'); g.fillStyle = '#123456'; g.fillStyle = U.shade('#E3BC62', .3); ok(g.fillStyle !== '#123456'); g.fillStyle = '#123456'; g.fillStyle = U.rgba('#E3BC62', .3); ok(g.fillStyle !== '#123456');
  });
  await T('RNG mulberry32 determinístico', () => {
    const a = E.RNG(42), b = E.RNG(42), c = E.RNG(43); const sa = [a(), a(), a()], sb = [b(), b(), b()]; eq(sa.join(), sb.join()); ok(sa[0] !== c());
    isFn(a, 'range int pick chance fork', 'rng');
    for (let i = 0; i < 300; i++) { const v = a(), r = a.range(5, 6), n = a.int(1, 3); ok(v >= 0 && v < 1 && r >= 5 && r < 6 && n >= 1 && n <= 3 && n === (n | 0)); }
    ok([1, 2].indexOf(a.pick([1, 2])) >= 0); ok(a.chance(1) && !a.chance(0));
    const f1 = E.RNG(7).fork(1), f2 = E.RNG(7).fork(1), f3 = E.RNG(7).fork(2); const v = f1(); eq(v, f2()); ok(v !== f3());
    let m = 0; const r = E.RNG(1); for (let i = 0; i < 4000; i++) m += r(); near(m / 4000, .5, .03, 'média');
  });
  await T('hash 0..1 determinístico', () => { for (let i = -50; i < 200; i++) { const v = E.hash(i * 1.37); ok(v >= 0 && v < 1); } eq(E.hash(12), E.hash(12)); ok(E.hash(1) !== E.hash(2)); });
  await T('Noise n1/n2/fbm1/fbm2: 0..1, contínuo, por semente', () => {
    const N = E.Noise; isFn(N, 'n1 n2 fbm1 fbm2', 'Noise');
    let lo = 1, hi = 0, prev = N.n1(0, 3);
    for (let i = 1; i < 2000; i++) { const x = i * .01, v = N.n1(x, 3); ok(v >= 0 && v <= 1); ok(Math.abs(v - prev) < .05, 'n1 contínuo'); prev = v; lo = Math.min(lo, v); hi = Math.max(hi, v); }
    ok(hi - lo > .5, 'n1 varia');
    for (let i = 0; i < 400; i++) { const x = i * .13 - 20, y = i * .07 - 9; for (const v of [N.n2(x, y, 1), N.fbm1(x, 4, 2), N.fbm2(x, y, 4, 2)]) ok(v >= 0 && v <= 1, 'faixa'); }
    eq(N.n2(1.5, 2.5, 9), N.n2(1.5, 2.5, 9)); ok(N.n1(1.5, 1) !== N.n1(1.5, 2), 'semente muda'); ok(isFinite(N.n1(.5)) && isFinite(N.fbm2(.5, .5)), 'defaults');
    ok(Math.abs(N.n2(3.999, 1.2, 0) - N.n2(4.001, 1.2, 0)) < .02, 'n2 contínuo na borda da célula');
  });
  await T('Emitter on/off/once/emit/clear', () => {
    const em = E.Emitter(); let n = 0, args = null; const off = em.on('a', (x, y) => { n++; args = [x, y]; });
    em.emit('a', 1, 2); eq(n, 1); eq(args.join(), '1,2'); eq(typeof off, 'function'); off(); em.emit('a'); eq(n, 1);
    let o = 0; em.once('b', () => o++); em.emit('b'); em.emit('b'); eq(o, 1);
    let c = 0; em.on('c', () => c++); em.clear(); em.emit('c'); eq(c, 0); em.emit('nada');
    // remover ouvinte durante o emit não pula o vizinho
    let s = ''; const o1 = em.on('d', () => { s += '1'; o1(); }); em.on('d', () => { s += '2'; }); em.emit('d'); em.emit('d'); eq(s, '122');
  });
  await T('Pool get/free/size', () => {
    let made = 0, resets = 0; const p = E.Pool(() => ({ id: ++made }), o => { resets++; o.v = 0; });
    const a = p.get(), b = p.get(); eq(made, 2); eq(resets, 2); p.free(a); eq(p.size, 1); const c = p.get(); ok(c === a, 'reaproveita'); eq(made, 2); eq(p.size, 0); ok(b !== a);
  });
  await T('Tween.to/wait/update/killOf/clear', () => {
    E.Tween.clear(); const o = { x: 0, y: 5 }; let ups = 0, done = 0;
    const h = E.Tween.to(o, { x: 10 }, 1, { ease: 'lin', delay: .5, onUpdate() { ups++; }, onDone() { done++; } });
    isFn(h, 'cancel', 'handle'); eq(h.done, false);
    E.Tween.update(.25); eq(o.x, 0, 'delay'); E.Tween.update(.75); near(o.x, 5, 1e-9); ok(ups > 0); E.Tween.update(.6); eq(o.x, 10); eq(done, 1); eq(h.done, true); eq(o.y, 5);
    E.Tween.update(1); eq(done, 1, 'onDone só 1x');
    let w = 0; const hw = E.Tween.wait(.3, () => w++); E.Tween.update(.2); eq(w, 0); E.Tween.update(.2); eq(w, 1); ok(hw.done);
    const p = { x: 0 }; const hc = E.Tween.to(p, { x: 1 }, 1); E.Tween.update(.5); hc.cancel(); const xv = p.x; E.Tween.update(.5); eq(p.x, xv, 'cancel para'); eq(hc.done, false);
    const k = { x: 0 }; E.Tween.to(k, { x: 1 }, 1); E.Tween.to(k, { x: 1 }, 2); E.Tween.killOf(k); E.Tween.update(1); eq(k.x, 0, 'killOf');
    const c = { x: 0 }; E.Tween.to(c, { x: 1 }, 1); E.Tween.clear(); E.Tween.update(1); eq(c.x, 0, 'clear');
    const e1 = { x: 0 }; E.Tween.to(e1, { x: 1 }, 1, { ease: U.ease.quadIn }); E.Tween.update(.5); near(e1.x, .25, 1e-9, 'ease função'); E.Tween.clear();
    const e2 = { x: 0 }; E.Tween.to(e2, { x: 1 }, 1, { ease: 'naoexiste' }); E.Tween.update(1); eq(e2.x, 1); E.Tween.clear();
  });
  await T('Tween bordas: dur 0, kill/clear dentro de callback, encadear', () => {
    E.Tween.clear();
    const a = { x: 0 }; let d = 0; E.Tween.to(a, { x: 7 }, 0, { onDone() { d++; } }); E.Tween.update(0.016); eq(a.x, 7, 'dur 0 chega'); eq(d, 1);
    const n = { x: 0 }; E.Tween.to(n, { x: 7 }, -1); E.Tween.update(0.016); eq(n.x, 7, 'dur negativa'); let w0 = 0; E.Tween.wait(0, () => w0++); E.Tween.update(0); eq(w0, 1, 'wait(0)');
    // killOf do próprio objeto e de um vizinho durante o update
    const b = { x: 0 }, c = { x: 0 }; let bd = 0, cd = 0;
    E.Tween.to(b, { x: 1 }, 1, { onUpdate() { E.Tween.killOf(c); E.Tween.killOf(b); }, onDone() { bd++; } });
    E.Tween.to(c, { x: 1 }, 1, { onDone() { cd++; } });
    E.Tween.update(2); eq(c.x, 0, 'vizinho morto não anda'); eq(bd, 0, 'cancelar no onUpdate do último frame não chama onDone'); eq(cd, 0); E.Tween.update(1);
    // cancel() do handle dentro do próprio onUpdate
    const s = { x: 0 }; let sd = 0; const hs = E.Tween.to(s, { x: 1 }, .1, { onUpdate() { hs.cancel(); }, onDone() { sd++; } }); E.Tween.update(1); eq(sd, 0, 'cancel no onUpdate'); eq(hs.done, false);
    // clear() dentro de onDone + tween novo criado no mesmo callback sobrevive e só anda no frame seguinte
    const e = { x: 0 }, f = { x: 0 }, z = { x: 0 }; E.Tween.to(z, { x: 1 }, 5);
    E.Tween.to(e, { x: 1 }, .1, { onDone() { E.Tween.clear(); E.Tween.to(f, { x: 10 }, 1, { ease: 'lin' }); } });
    E.Tween.update(.5); eq(e.x, 1); eq(f.x, 0, 'tween novo não anda no mesmo frame'); E.Tween.update(.5); near(f.x, 5, 1e-9); E.Tween.update(.5); eq(f.x, 10); ok(z.x < 1, 'clear matou z');
    // cadeia de waits
    let chain = ''; E.Tween.wait(.1, () => { chain += 'a'; E.Tween.wait(.1, () => { chain += 'b'; }); }); for (let i = 0; i < 5; i++) E.Tween.update(.1); eq(chain, 'ab');
    // muitos tweens morrendo em ordens diferentes não vazam
    for (let i = 0; i < 200; i++) E.Tween.to({ x: 0 }, { x: 1 }, .01 + (i % 7) * .01); for (let i = 0; i < 20; i++) E.Tween.update(.01);
    if ('count' in E.Tween) eq(E.Tween.count, 0, 'lista vazia no fim');
    // NaN/propriedade inexistente não explode
    const u = {}; E.Tween.to(u, { q: 3 }, .1); E.Tween.update(.2); eq(u.q, 3); E.Tween.clear();
  });
  await T('Timers every/cooldown/E.Timer', () => {
    let n = 0; const ev = E.every(.5, () => n++); isFn(ev, 'tick', 'every'); ev.tick(.4); eq(n, 0); ev.tick(.2); eq(n, 1); ev.tick(1); eq(n, 3); ev.tick(0); eq(n, 3);
    const cd = E.cooldown(1); isFn(cd, 'ready use tick', 'cooldown'); ok(cd.ready()); ok(cd.use() !== false); ok(!cd.ready()); near(cd.frac, 0, 1e-9); cd.tick(.5); near(cd.frac, .5, 1e-9); ok(!cd.ready()); cd.tick(.6); ok(cd.ready()); near(cd.frac, 1, 1e-9);
    ok(E.Timer && typeof E.Timer === 'object');
  });
  await T('Scenes add/go/push/pop/current/update/render', () => {
    const S = E.Scenes.create ? E.Scenes.create() : E.Scenes; isFn(E.Scenes, 'add go push pop update render', 'Scenes'); ok('current' in E.Scenes);
    let log = ''; const sc = n => ({ enter(a) { log += n + 'E' + (a || '') + ' '; }, exit() { log += n + 'X '; }, update(dt) { log += n + 'U' + dt + ' '; }, render(g) { log += n + 'R' + g + ' '; } });
    S.add('a', sc('a')); S.add('b', sc('b')); S.add('c', sc('c'));
    S.go('a', 1); ok(S.current, 'current'); S.update(2); S.render('g'); S.push('b', 3); S.update(1); S.render('g'); S.pop(); S.update(4); S.go('c'); S.render('g');
    eq(log, 'aE1 aU2 aRg bE3 bU1 aRg bRg bX aU4 aX cE cRg ');
    let threw = false; try { S.go('nao-existe'); } catch (e) { threw = true; } ok(threw, 'cena inexistente avisa'); S.pop(); S.pop(); S.update(1); S.render('g');
  });

  /* ---------- Save ---------- */
  sec('core.Save');
  const SK = 'kome.ftest.' + Math.floor(Math.random() * 1e9);
  const cleanup = () => { try { for (const k of Object.keys(localStorage)) if (k.indexOf('kome.ftest.') === 0) localStorage.removeItem(k); } catch (e) { /* sem localStorage */ } };
  await T('roundtrip + __t/__v + defaults profundos', () => {
    const mkS = () => E.Save(SK, { version: 2, defaults: () => ({ rice: 0, up: { pa: 0, bowl: 1 }, list: [], name: 'kome' }) });
    const a = mkS(); isFn(a, 'load save saveSoon clear exportStr importStr offlineSeconds', 'save');
    const d = a.load(); ok(d === a.data, 'load devolve data'); eq(d.rice, 0); eq(d.up.bowl, 1);
    d.rice = 123; d.up.pa = 9; d.list.push(4); ok(a.save() !== false);
    const b = mkS(), e = b.load(); eq(e.rice, 123); eq(e.up.pa, 9); eq(e.list[0], 4); eq(e.__v, 2); ok(Math.abs(e.__t - Date.now()) < 5000, '__t');
    // save antigo sem campos novos: defaults completam sem apagar o que existe

    const f = data(hd({ face: -1 })), d0 = data(a); let bad = 0; for (let y = 0; y < 300; y += 3) for (let k = -120; k < 120; k += 3) { if (d0[(y * 320 + 160 + k) * 4 + 3] !== f[(y * 320 + 160 - k - 1) * 4 + 3]) bad++; } ok(bad < 40, 'face=-1 espelha em torno de x (' + bad + ')');
    const s2 = bbox(hd({ scale: 3 })); near(s2.x1 - s2.x0, (bb.x1 - bb.x0) / 2, 4, 'scale'); const c = mk(320, 300), g = c.getContext('2d'); E.drawShibaHead(g, 160, 150, 0); E.drawShibaHead(g, 160, 150, 5, { expr: 'nao-existe' }); ok(count(c) > 5000, 'defaults');
    g.globalAlpha = .6; g.imageSmoothingEnabled = true; E.drawShibaHead(g, 160, 150, 2, { expr: 'happy' }); near(g.globalAlpha, .6, 1e-6); eq(g.imageSmoothingEnabled, true, 'estado');
  });
  await T('PAW / MOUTH / HEAD + shibaAnchor(pose,t,nome)', () => {
    eq(E.PAW.x, 9); eq(E.PAW.y, -6); eq(E.MOUTH.x, 11); eq(E.MOUTH.y, -18); eq(E.HEAD.x, 10); eq(E.HEAD.y, -26);
    E.SHIBA_POSES.forEach(p => { for (const t of [0, .4, 3.3]) for (const n of ['paw', 'mouth', 'head', 'back', 'hatTop']) { const a = E.shibaAnchor(p, t, n); ok(a && isFinite(a.x) && isFinite(a.y), p + '.' + n); ok(a.x >= -25 && a.x <= 27 && a.y >= -47 && a.y <= 3, p + '.' + n + ' fora do sprite: ' + a.x.toFixed(1) + ',' + a.y.toFixed(1)); } });
    const hs = E.shibaAnchor('stand', 1, 'head'), ht = E.shibaAnchor('stand', 1, 'hatTop'), mo = E.shibaAnchor('stand', 1, 'mouth'), bk = E.shibaAnchor('stand', 1, 'back'), pw = E.shibaAnchor('stand', 1, 'paw');
    ok(ht.y < hs.y - 6, 'hatTop acima da cabeça'); ok(mo.x > hs.x && mo.y > hs.y, 'boca à frente/abaixo'); ok(bk.x < hs.x, 'costas atrás'); ok(pw.y > -6, 'pata no chão em stand'); near(hs.x, E.HEAD.x, 3, 'head ~ HEAD'); near(hs.y, E.HEAD.y, 5);
    ok(E.shibaAnchor('carry', 1, 'paw').y < -30, 'carry: pata no alto'); ok(E.shibaAnchor('point', 1, 'paw').x > 14, 'point: pata à frente');
    // âncora cai em cima de pixel desenhado (cabeça) e a pata fica na borda do desenho
    E.SHIBA_POSES.forEach(p => { const t = 1.3, c = shot(p, t, { exact: true, shadow: false }, 120, 100, 60, 80), h = E.shibaAnchor(p, t, 'head'); ok(px(c, Math.floor(60 + h.x), Math.floor(80 + h.y))[3] === 255, p + ': head fora do desenho'); });
    const a1 = E.shibaAnchor('nao-existe', 1, 'paw'), a2 = E.shibaAnchor('stand', 1, 'nao-existe'); ok(isFinite(a1.x) && isFinite(a2.x), 'nomes desconhecidos');
  });
  await T('Actor: campos, update, draw, hold, say', () => {
    const a = E.Actor({ x: 100, y: 120, pal: 'goma', pose: 'walk', vx: 30 }); has(a, 'x y face pose t pal scale squash rot vx vy hold', 'actor'); isFn(a, 'say update draw', 'actor'); eq(a.x, 100); eq(a.pal, 'goma'); eq(a.scale, 1); eq(a.face, 1);
    const t0 = a.t; a.update(.5); near(a.x, 115, 1e-9, 'vx'); near(a.t, t0 + .5, 1e-9, 't'); a.vx = -30; a.vy = 10; a.update(.1); eq(a.face, -1, 'face segue vx'); near(a.y, 121, 1e-9, 'vy');
    const d = E.Actor(); ok(isFinite(d.x) && d.pose && d.pal, 'defaults');
    const c = mk(240, 200), g = c.getContext('2d'); const b = E.Actor({ x: 120, y: 160, pose: 'stand', t: 1 }); b.draw(g); const n0 = count(c); ok(n0 > 400, 'draw'); const bb = bbox(c); ok(bb.y1 >= 157 && bb.y1 <= 162, 'pés em y');
    // hold: sprite aparece perto da pata, acompanha face e escala
    const item = E.Pix(5, 5).rect(0, 0, 5, 5, '#00ff00').canvas(false); b.hold = item; g.clearRect(0, 0, 240, 200); b.draw(g);
    const green = cv => { const dd = data(cv); let sx = 0, sy = 0, n = 0; for (let i = 0; i < dd.length; i += 4) if (dd[i + 1] === 255 && dd[i] === 0 && dd[i + 3] === 255) { const p = i / 4; sx += p % cv.width; sy += Math.floor(p / cv.width); n++; } return { n, x: sx / n, y: sy / n }; };
    let gr = green(c); ok(gr.n >= 12, 'hold desenhado (' + gr.n + ')'); const pw = E.shibaAnchor('stand', 1, 'paw'); near(gr.x, 120 + pw.x, 6, 'hold na pata x'); near(gr.y, 160 + pw.y, 6, 'hold na pata y');
    b.face = -1; g.clearRect(0, 0, 240, 200); b.draw(g); const gl = green(c); near(gl.x, 120 - pw.x, 6, 'hold espelha com face'); b.face = 1; b.scale = 2; g.clearRect(0, 0, 240, 200); b.draw(g); gr = green(c); near(gr.x, 120 + pw.x * 2, 9, 'hold escala'); ok(gr.n > 60, 'hold escala junto');
    b.scale = 1; b.hold = { cv: item, ax: 2, ay: 2 }; g.clearRect(0, 0, 240, 200); b.draw(g); ok(green(c).n >= 12, 'hold {cv,ax,ay}'); b.hold = null;
    // say: balão aparece acima da cabeça e some depois do tempo
    g.clearRect(0, 0, 240, 200); const r = b.say('Au au!', .5); ok(r === b || r === undefined, 'say encadeia'); b.update(.25); b.draw(g); const nb = count(c), bt = bbox(c); ok(nb > n0 + 300, 'balão desenhado'); ok(bt.y0 < 160 - 50, 'balão acima da cabeça');
    b.update(.5); g.clearRect(0, 0, 240, 200); b.draw(g); ok(count(c) < n0 + 80, 'balão some'); b.say('x', 0); b.update(.01); b.draw(g); b.say('', 1); b.update(.1); b.draw(g); b.say('palavra-gigante-sem-espaço-nenhum-que-não-quebra', 1); b.update(.3); b.draw(g);
    b.say(12345, 1); b.update(.3); b.draw(g); eq(g.globalAlpha, 1, 'alpha'); const m = g.getTransform(); ok(m.a === 1 && m.e === 0, 'transform');
    // squash/rot/scale do ator chegam no desenho
    const sA = E.Actor({ x: 120, y: 160, pose: 'stand', t: 1, scale: 2, shadow: false }); g.clearRect(0, 0, 240, 200); sA.draw(g); const b2 = bbox(c); ok(b2.x1 - b2.x0 > 60, 'scale'); if ('visible' in sA) { sA.visible = false; g.clearRect(0, 0, 240, 200); sA.draw(g); eq(count(c), 0, 'visible=false'); }
  });
  await T('Actor.hold segue a pata sem tremer (âncora no mesmo t do frame cacheado)', () => {
    // em 'walk' a pata sobe e desce: o item tem que ficar sempre colado na âncora do frame que foi desenhado
    const item = E.Pix(3, 3).rect(0, 0, 3, 3, '#00ff00').canvas(false), fps = E.drawShiba.fps || 30; let worst = 0;
    for (let i = 0; i < 90; i++) {
      const t = 2 + i / 97, a = E.Actor({ x: 60, y: 80, pose: 'sign', t, hold: item, shadow: false }), c = mk(120, 100), g = c.getContext('2d'); a.draw(g);
      const dd = data(c); let sx = 0, sy = 0, n = 0; for (let k = 0; k < dd.length; k += 4) if (dd[k + 1] === 255 && dd[k] === 0) { const p = k / 4; sx += p % 120 + .5; sy += Math.floor(p / 120) + .5; n++; }
      const q2 = E.shibaAnchor('sign', Math.round(t * fps) / fps, 'hold'); worst = Math.max(worst, Math.abs(sx / n - (60 + q2.x)), Math.abs(sy / n - (80 + q2.y)));
    }
    ok(worst < .76, 'item descolou da pata do frame desenhado: ' + worst.toFixed(2) + ' px');
  });

  /* ---------- cache: memória limitada e desempenho ---------- */
  sec('shiba.cache');
  if (!q.has('quick')) await T('100 atores por 20 s simulados: cache limitado', () => {
    const real = document.createElement.bind(document); let made = 0; document.createElement = function (tag) { if (String(tag).toLowerCase() === 'canvas') made++; return real(tag); };
    try {
      E.drawShiba.clear && E.drawShiba.clear(); const r = E.RNG(5), pals = Object.keys(E.PALS), actors = [], c = mk(960, 540), g = c.getContext('2d');
      for (let i = 0; i < 100; i++) actors.push(E.Actor({ x: r.range(20, 940), y: r.range(60, 530), pose: r.pick(E.SHIBA_POSES), pal: r.pick(pals), face: r.chance(.5) ? 1 : -1, t: r.range(0, 50), hat: r.chance(.8) }));
      const t0 = performance.now(); let frames = 0, worst = 0;
      for (let f = 0; f < 1200; f++) {
        const f0 = performance.now(); if (f % 90 === 0) for (let i = 0; i < 100; i += 7) actors[i].pose = r.pick(E.SHIBA_POSES);
        if (f % 4 === 0) g.clearRect(0, 0, 960, 540); for (let i = 0; i < 100; i++) { actors[i].update(1 / 60); actors[i].draw(g); } frames++; worst = Math.max(worst, performance.now() - f0);
      }
      const ms = (performance.now() - t0) / frames, st = E.drawShiba.stats || {};
      FT.cache = { canvasesCreated: made, msPerFrame: +ms.toFixed(2), worstFrame: +worst.toFixed(1), hits: st.hits, misses: st.misses, size: E.drawShiba.cacheSize };
      console.log('[kome] foundation: cache 100 atores x 1200 frames: ' + ms.toFixed(2) + ' ms/frame (pior ' + worst.toFixed(1) + '), canvases criados ' + made + ', cache ' + E.drawShiba.cacheSize + '/' + E.drawShiba.cacheMax);
      ok(made <= (E.drawShiba.cacheMax || 640) + 8, 'canvases criados sem limite: ' + made);
      if (E.drawShiba.cacheSize !== undefined) ok(E.drawShiba.cacheSize <= E.drawShiba.cacheMax, 'cacheSize ' + E.drawShiba.cacheSize);
      ok(ms < 12, 'lento demais: ' + ms.toFixed(2) + ' ms por frame de 100 atores');
    } finally { document.createElement = real; }
  });
  await T('1000 paletas-objeto diferentes não estouram o cache nem quebram', () => {
    const real = document.createElement.bind(document); let made = 0; document.createElement = function (tag) { if (String(tag).toLowerCase() === 'canvas') made++; return real(tag); };
    try { const c = mk(96, 80), g = c.getContext('2d'); for (let i = 0; i < 1000; i++) { const h = '#' + ((i * 2654435761 >>> 8) & 0xffffff).toString(16).padStart(6, '0'); E.drawShiba(g, 48, 60, 'sit', 1, { pal: { h, g: '#444444', o: h, c: '#ffffff', k: '#000000', n: '#000000', p: '#ff8888' } }); E.drawShibaHead(g, 48, 40, 1, { scale: 1, pal: { h, g: '#444444', o: h, c: '#ffffff', k: '#000000', n: '#000000', p: '#ff8888' } }); } ok(count(c) > 300); ok(made <= 1500, 'canvases: ' + made); }
    finally { document.createElement = real; }
  });
  await T('bench: 100 shibas/frame (poses, paletas e t diferentes)', () => {
    const c = mk(960, 540), g = c.getContext('2d'), pals = Object.keys(E.PALS), P = E.SHIBA_POSES; const run = (exact, frames) => { const t0 = performance.now(); for (let f = 0; f < frames; f++) { const t = 10 + f / 60; for (let i = 0; i < 100; i++) E.drawShiba(g, 20 + (i % 20) * 46, 60 + Math.floor(i / 20) * 96, P[i % P.length], t + i * .173, { pal: pals[i % pals.length], face: i & 1 ? 1 : -1, exact }); } return (performance.now() - t0) / frames; };
    run(false, 30); const cached = run(false, 240), exact = run(true, 60); FT.bench = { cached: +cached.toFixed(2), exact: +exact.toFixed(2) };
    console.log('[kome] foundation: bench 100 shibas/frame = ' + cached.toFixed(2) + ' ms (cache) | ' + exact.toFixed(2) + ' ms (exato)'); ok(cached < 8, 'cache lento: ' + cached.toFixed(2) + ' ms');
  });

  /* ==========================================================================
     Resumo + mostruário visual (os três módulos juntos, espelhado e de longe)
     ========================================================================== */
  const tests = results.filter(r => r.name), fails = tests.filter(r => !r.pass);
  FT.pass = tests.length - fails.length; FT.fail = fails.length; FT.failed = fails.map(f => f.name + ' — ' + f.err);
  console.log('[kome] foundation: RESUMO ' + FT.pass + '/' + tests.length + ' PASS' + (fails.length ? ' · ' + fails.length + ' FAIL' : ' · tudo ok') + ' (janela ' + innerWidth + 'x' + innerHeight + ', dpr ' + devicePixelRatio + ', escala ' + stage.scale.toFixed(3) + ')');

  const list = document.createElement('div'); list.className = 'ft-list'; stage.layer().appendChild(list);
  FT.taps.length = 0;                                       // só os toques de verdade (pós-testes) aparecem no palco
  results.forEach(r => { const d = document.createElement('div'); if (r.sec) { d.className = 'sec'; d.textContent = r.sec; } else { d.className = r.pass ? 'ok' : 'bad'; d.textContent = r.name.replace(/^[^·]+· /, '') + (r.pass ? '' : ' — ' + r.err); } list.appendChild(d); });

  const sprOni = E.sprite('ft-onigiri', 16, 16, P => { P.tri(8, 1, 1, 14, 15, 14, PAL.rice).rrect(1, 9, 14, 6, 3, PAL.rice).rect(5, 9, 6, 6, PAL.leafD).shadeBelow(PAL.rice, .12); });
  const crane = (g, t) => {            // mini guindaste com todas as primitivas (pés em 0,0, virado pra +x)
    Draw.track(g, -46, -16, 92, 16, t * 20); Draw.box(g, -34, -44, 56, 28, PAL.yel, { rivets: true, panels: 3, stripes: 'bottom' }); Draw.window(g, 4, -40, 14, 12);
    Draw.lattice(g, -30, -96, 10, 52, 9, 1.6, PAL.ora); Draw.truss(g, pt(A2, -20, -50), pt(B2, 70, -92), 10, 2, PAL.yel); Draw.cable(g, pt(A2, -25, -96), pt(B2, 70, -92), { lw: 1 }); Draw.cable(g, pt(A2, 70, -92), pt(B2, 70, -30), { lw: 1 });
    Draw.piston(g, pt(A2, -6, -42), pt(B2, 24 + Math.sin(t) * 4, -66), 4, { len: 16 }); Draw.light(g, -25, -99, 2.4, PAL.red, Math.sin(t * 6) > 0); Draw.wheel(g, 70, -22, 8, t * 2); Draw.sign(g, -30, -40, 28, 9, 'KOME');
  };

    const g = stage.begin(), t = tAcc;

    Draw.text(g, FT.pass + '/' + tests.length + ' PASS' + (FT.fail ? ' · ' + FT.fail + ' FAIL' : ''), 600, 22, { size: 17, align: 'right', col: FT.fail ? '#B3261E' : '#4E8A2E', stroke: '#FFFAE6', sw: 4 });
    Draw.box(g, 614, 10, 336, 520, '#BFE3F2', { r: 8, top: false, shade: false });

    Draw.box(g, 614, 150, 336, 8, PAL.grass, { ol: 0 }); sc(700, 150, 1, 1); sc(870, 150, 1, -1);
    Draw.box(g, 614, 215, 336, 8, PAL.grass, { ol: 0 }); sc(660, 215, .35, 1); sc(735, 215, .35, -1); sc(790, 215, .15, 1); sc(825, 215, .15, -1);
    for (let i = 0; i < 6; i++) E.drawShiba(g, 850 + i * 17, 215, 'walk', t + i * .3, { scale: .3 });
    Draw.text(g, 'z=1 · z=.35 · z=.15 (normal e espelhado) + shibas a .3', 782, 236, { size: 10, col: '#3B2818', stroke: null });
    // todas as poses, metade espelhada
    E.SHIBA_POSES.forEach((p, i) => { const x = 640 + (i % 8) * 40, y = 292 + Math.floor(i / 8) * 46; E.drawShiba(g, x, y, p, t + i * .31, { face: i & 1 ? -1 : 1, pal: Object.keys(E.PALS)[i % 11] }); });
    E.drawShibaHead(g, 660, 494, t, { scale: 2, expr: 'happy' }); E.drawShibaHead(g, 740, 494, t, { scale: 2, expr: 'shock', face: -1, pal: 'kuro' });

    for (let i = 0; i < FT.taps.length; i++) Draw.ring(g, FT.taps[i][0], FT.taps[i][1], 7, 2, PAL.gold);
  } }).start();
  FT.done = true;
})();

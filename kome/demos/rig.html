<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pixxel · rig.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #3B2818; overflow: hidden; }
</style>
</head>
<body>
<script src="../engine/core.js"></script>
<script src="../engine/pix.js"></script>
<script src="../engine/shiba.js"></script>
<script src="../engine/fx.js"></script>
<script src="../engine/rig.js"></script>
<script>
/* Demo do rig.js: três máquinas montadas só com E.Rig + E.Draw (copie à vontade).
   1) trator com carregadeira frontal (dois braços, pistão de levante + pistão de báscula, suspensão, escapamento);
   2) escavadeira hidráulica: a caçamba segue o mouse por IK (segure o clique pra fechar a caçamba), cabine gira pro lado do alvo;
   3) linha de esteira subindo arroz + guincho de mastro telescópico com cabo e polias.
   URL: ?scene=1|2|3 mostra uma só em tela cheia; ?z=zoom.
   Automação: __demo.step(seg) avança o tempo; __demo.aim(x,y,curl) mira a escavadeira (coords do modelo); __demo.tr / .ex / .ln. */
(function () {
  'use strict';
  const E = Pixxel, U = E.U, PAL = E.PAL, Draw = E.Draw, Rig = E.Rig;
  const W = 960, H = 540, LINE = E.LINE_CSS, PI = Math.PI, TAU = PI * 2;
  const q = new URLSearchParams(location.search);
  const ONLY = +(q.get('scene') || 0);

  const stage = E.Stage({ width: W, height: H, bg: PAL.ink });
  const g = stage.g;
  const input = E.Input(stage);
  const SOIL = '#C7A26A', SOIL_D = '#A8834F';
  const mixCache = {};
  const mix = (a, b, t) => mixCache[a + b + t] || (mixCache[a + b + t] = U.mixCss(a, b, t));
  const shade = (c, k) => mixCache[c + '|' + k] || (mixCache[c + '|' + k] = U.shade(c, k));

  /* ======================================================================
     Cenário comum de um painel
     ====================================================================== */
  function hillLine(g, v, base, amp, f, seed, col, par, camX) {
    g.fillStyle = col; g.beginPath(); g.moveTo(v.x0, v.y1);
    for (let x = v.x0; x <= v.x1 + 8; x += 8) {
      const u = (x - camX) + camX * par;
      g.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin(u * f + seed)) - amp * 0.4 * Math.sin(u * f * 2.3 + seed * 2));
    }
    g.lineTo(v.x1 + 8, v.y1); g.closePath(); g.fill();
  }
  function scenery(g, v, cam, floor, t, seed) {
    g.fillStyle = PAL.sky; g.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    g.fillStyle = mix(PAL.sky, PAL.skyL, 0.45); g.fillRect(v.x0, -70, v.x1 - v.x0, 80);
    g.fillStyle = mix(PAL.sky, PAL.skyL, 0.8); g.fillRect(v.x0, -38, v.x1 - v.x0, 60);
    // nuvens chapadas
    for (let i = 0; i < 4; i++) {
      const span = 520, cx = ((i * 173 + seed * 61 + t * (4 + i) - cam.x * 0.15) % span + span) % span - span / 2 + cam.x, cy = -150 + i * 22 + (seed * 13 % 20);
      g.fillStyle = PAL.cream;
      g.beginPath(); g.ellipse(cx, cy, 26, 8, 0, 0, TAU); g.ellipse(cx + 14, cy - 6, 14, 8, 0, 0, TAU); g.ellipse(cx - 13, cy - 4, 11, 6, 0, 0, TAU); g.fill();
    }
    hillLine(g, v, -18, 46, 0.012, seed, mix(PAL.grassL, PAL.sky, 0.55), 0.25, cam.x);
    hillLine(g, v, -6, 30, 0.021, seed + 2, mix(PAL.grass, PAL.sky, 0.3), 0.5, cam.x);
    // chão: terra + faixa de grama + contorno
    g.beginPath(); g.moveTo(v.x0 - 4, v.y1 + 4);
    for (let x = v.x0 - 4; x <= v.x1 + 4; x += 3) g.lineTo(x, floor(x));
    g.lineTo(v.x1 + 4, v.y1 + 4); g.closePath();
    g.fillStyle = SOIL; g.fill();
    g.save(); g.clip();
    g.lineJoin = 'round';
    g.beginPath(); for (let x = v.x0 - 4; x <= v.x1 + 4; x += 3) g.lineTo(x, floor(x) + 13); g.strokeStyle = SOIL_D; g.lineWidth = 3; g.stroke();
    g.beginPath(); for (let x = v.x0 - 4; x <= v.x1 + 4; x += 3) g.lineTo(x, floor(x) + 3); g.strokeStyle = PAL.grass; g.lineWidth = 9; g.stroke();
    g.beginPath(); for (let x = v.x0 - 4; x <= v.x1 + 4; x += 3) g.lineTo(x, floor(x) + 0.5); g.strokeStyle = PAL.grassL; g.lineWidth = 2.4; g.stroke();
    g.fillStyle = SOIL_D;
    for (let x = Math.floor(v.x0 / 17) * 17; x < v.x1; x += 17) { const h = E.hash(x * 7 + seed); g.fillRect(x + h * 9, floor(x) + 18 + h * 16, 3, 1.5); }
    g.restore();
    g.beginPath(); for (let x = v.x0 - 4; x <= v.x1 + 4; x += 3) g.lineTo(x, floor(x)); g.strokeStyle = LINE; g.lineWidth = 1.6; g.stroke();
    // tufos de grama balançando
    g.strokeStyle = PAL.grassD; g.lineWidth = 1.3; g.lineCap = 'round'; g.beginPath();
    for (let x = Math.floor(v.x0 / 23) * 23; x < v.x1; x += 23) {
      const h = E.hash(x + seed * 3), bx = x + h * 15, by = floor(bx) + 0.5, sw = Math.sin(t * 2 + x) * 1.2;
      g.moveTo(bx, by); g.lineTo(bx - 2 + sw, by - 4 - h * 2); g.moveTo(bx + 1.5, by); g.lineTo(bx + 2 + sw, by - 5 - h * 3); g.moveTo(bx + 3, by); g.lineTo(bx + 5.5 + sw, by - 3.5);
    }
    g.stroke();
  }
  // monte grande de arroz
  function ricePile(g, x, y, hw, h, squash) {
    g.save(); g.translate(x, y); g.scale(1 + squash * 0.5, 1 - squash);
    Draw.shadow(g, 0, 1, hw * 1.05, 4, 0.16);
    Rig.mound(g, 0, 1, hw, h, { grains: false });
    g.fillStyle = PAL.riceD;
    for (let i = 0; i < 16; i++) { const a = E.hash(i * 3.1), b = E.hash(i * 7.7 + 1); const px = (a - 0.5) * hw * 1.5, top = h * (1 - Math.pow(Math.abs(px) / hw, 1.7)) * 0.9; g.fillRect(px, -b * top, 2.6, 1.1); }
    g.fillStyle = PAL.white;
    for (let i = 0; i < 7; i++) { const a = E.hash(i * 5.3 + 9), b = E.hash(i * 2.9 + 4); const px = (a - 0.75) * hw * 1.1, top = h * (1 - Math.pow(Math.abs(px) / hw, 1.7)) * 0.9; g.fillRect(px, -(0.45 + b * 0.5) * top, 3.4, 1.3); }
    g.restore();
  }
  const GRAIN = { shape: 'grain', c: [PAL.rice, PAL.rice, PAL.riceS], land: true, w: 1.9, life: 1.6, ol: true, speed: [20, 70], spread: 0.7, dir: PI / 2 };

  /* ======================================================================
     1) TRATOR COM CARREGADEIRA
     ====================================================================== */
  function makeTractor() {
    const floor = x => -(2.6 * Math.sin(x * 0.031) + 1.5 * Math.sin(x * 0.083 + 1.2) + 0.8 * Math.sin(x * 0.21 + 2));
    const BODY = PAL.ora, ARM = PAL.yel, CYL = PAL.blkL;
    const rig = Rig();
    const ch = E.Chassis({ wheels: [{ x: -26, r: 24, travel: 4 }, { x: 34, r: 14, travel: 4 }], floor, k: 130, d: 9, tiltK: 90, tiltD: 8, squat: 0.0026 });
    const J = {
      boom: E.Joint(0.06, { k: 24, d: 7.4, min: -1.05, max: 0.1, speed: 1.0 }),       // pesado: demora a sair e passa um pouco do ponto
      bucket: E.Joint(0.05, { k: 70, d: 11, min: -1.0, max: 2.05, speed: 3.2 }),    // leve e rápido
    };
    const antenna = E.Spring(0, { k: 70, d: 3.2 }), flap = E.Spring(0, { k: 220, d: 9 }), pile = E.Spring(0, { k: 180, d: 9 });
    const exhaust = E.Exhaust({ size: 2.6, rate: 4.5, rise: 30, wind: -6 });
    const ps = E.Particles(500), psBin = E.Particles(300);
    const S = { x: -40, v: 0, vT: 0, face: 1, turn: 0, turnTo: 1, st: 0, st_t: 0, t: 0, load: 0, abs: 0.05, power: 0, binFill: 0.25, idle: 0 };
    const PILE_X = 205, BIN_X = -212, X_DIG = 62, X_DUMP = -112;
    const BOOM = [[0, 0, 5.5], [46, 9, 7.5], [62, 50, 4.6]];
    const tmp = {}, tmp2 = {};

    /* ---- peças ---- */
    const wheelDraw = far => (gg, p) => Draw.wheel(gg, 0, 0, p.data.r, p.data.rot, far ? { tire: shade(PAL.blk, -0.35), hub: shade(PAL.yelL, -0.4) } : { hub: PAL.yelL });
    rig.part('wRearF', { z: -10, x: -22, y: -26, data: ch.wheels[0], draw: wheelDraw(true) });
    rig.part('wFrontF', { z: -10, x: 38, y: -16, data: ch.wheels[1], draw: wheelDraw(true) });
    rig.part('body', { z: 0, draw: drawBody });
    rig.part('driver', { parent: 'body', z: 0.5, x: -24, y: -57, draw: (gg, p, r, t) => E.drawShiba(gg, 0, 0, 'drive', t, { scale: 0.62, shadow: false }) });
    rig.part('cab', { parent: 'body', z: 1, draw: drawCab });
    rig.part('hood', { parent: 'body', z: 2, draw: drawHood });
    rig.part('wRear', { z: 4, data: ch.wheels[0], draw: wheelDraw(false) });
    rig.part('wFront', { z: 4, data: ch.wheels[1], draw: wheelDraw(false) });
    rig.part('fender', { parent: 'body', z: 4.5, draw: drawFender });
    rig.part('tower', { parent: 'body', z: 5, draw: gg => { Rig.plate(gg, [[1, -30, 6], [4, -58, 5.5]], shade(ARM, -0.12)); Rig.pin(gg, 16, -27, 2.4); } });
    // braço de trás (o "segundo braço"): mesma junta, deslocado e mais escuro
    rig.part('boomF', { parent: 'body', z: -8, x: 8, y: -60.5, draw: gg => Rig.plate(gg, BOOM, shade(ARM, -0.3), { hi: false }) });
    rig.part('boom', { parent: 'body', z: 7, x: 4, y: -58, joint: J.boom, draw: gg => {
      Rig.plate(gg, BOOM, ARM);
      Rig.plate(gg, [[30, 6, 2.2], [44, 9, 2.2]], shade(ARM, -0.2), { ol: 0, hi: false, shade: false });     // reforço
      Rig.pin(gg, 0, 0, 3); Rig.pin(gg, 62, 50, 2.6);
    } });
    rig.part('bucket', { parent: 'boom', z: 6.4, x: 62, y: 50, joint: J.bucket, draw: gg => {
      Rig.plate(gg, [[0, -3, 3.4], [2, -14, 2.8]], shade(PAL.gray, -0.1));                                 // orelha da báscula
      Rig.bucket(gg, 37, { col: PAL.gray, load: S.load });
    } });
    rig.piston('liftF', { a: ['body', 20, -29.5], b: ['boomF', 34, 9], w: 5, z: -9, col: shade(CYL, -0.2) });
    rig.piston('lift', { a: ['body', 16, -27], b: ['boom', 34, 9], w: 5.6, z: 7.5, col: CYL });
    rig.piston('tilt', { a: ['boom', 22, -1], b: ['bucket', 2, -14], w: 4.4, z: 8, col: CYL });
    rig.calibrate('lift', [['boom', J.boom.min, J.boom.max]]);
    rig.calibrate('liftF', [['boomF', J.boom.min, J.boom.max]]);
    rig.calibrate('tilt', [['bucket', J.bucket.min, J.bucket.max]]);

    function drawBody(gg, p, r, t) {
      Draw.box(gg, -38, -36, 84, 13, PAL.blkL, { r: 3 });                           // longarina/caixa de câmbio
      Draw.box(gg, -44, -60, 46, 27, BODY, { r: 5 });                               // base da cabine
      Draw.box(gg, -30, -52, 12, 4, PAL.blk, { ol: 0, r: 1 });                       // banco
      // degrau
      Draw.box(gg, -8, -24, 12, 3, PAL.grayD);
      Draw.beam(gg, [[-12, -62], [-9, -70]], 2.2, PAL.blk, { hi: false });           // coluna do volante
      Draw.ring(gg, -8, -71.5, 4.2, 1.6, PAL.blk, { ol: 1, hi: false });
    }
    function drawCab(gg, p, r, t) {
      // santantônio + teto (cabine aberta: dá pra ver o Kome)
      Draw.beam(gg, [[-41, -60], [-41, -94]], 3.4, PAL.blk, { hi: false });
      Draw.beam(gg, [[-2, -60], [-8, -94]], 3.4, PAL.blk, { hi: false });
      Draw.box(gg, -48, -100, 50, 7, PAL.cream, { r: 3, shade: PAL.sand });
      // giroflex e antena com mola
      Draw.light(gg, -20, -103, 3, PAL.ora, Math.sin(t * 9) > 0.2);
      gg.save(); gg.translate(-44, -100); gg.rotate(antenna.x);
      gg.strokeStyle = LINE; gg.lineWidth = 1.4; gg.lineCap = 'round';
      gg.beginPath(); gg.moveTo(0, 0); gg.quadraticCurveTo(antenna.x * -14, -11, antenna.x * 16, -22); gg.stroke();
      gg.fillStyle = LINE; gg.beginPath(); gg.arc(antenna.x * 16, -22, 2.6, 0, TAU); gg.fill();
      gg.fillStyle = PAL.red; gg.beginPath(); gg.arc(antenna.x * 16, -22, 1.7, 0, TAU); gg.fill();
      gg.restore();
    }
    function drawHood(gg, p, r, t) {
      // escapamento (antes do capô): cano, abafador e tampinha que bate com o pulso
      Draw.box(gg, 16, -80, 4, 26, PAL.steelD);
      Draw.box(gg, 14, -70, 8, 11, PAL.blk, { r: 2 });
      gg.save(); gg.translate(15, -81); gg.rotate(-0.15 - flap.x);
      Draw.box(gg, 0, -1.6, 7, 2, PAL.steelD, { ol: 1.2 });
      gg.restore();
      Draw.box(gg, 0, -58, 50, 25, BODY, { r: 6, panels: 3 });
      Draw.box(gg, 46, -54, 5, 18, PAL.blk, { r: 2, ol: 1.5 });                       // grade
      gg.fillStyle = PAL.blkL; for (let i = 0; i < 4; i++) gg.fillRect(47, -52 + i * 4.2, 3, 1.6);
      Draw.light(gg, 49, -57, 2.6, PAL.goldL, true);
      gg.fillStyle = shade(BODY, -0.3); for (let i = 0; i < 3; i++) gg.fillRect(26 + i * 5, -46, 2.4, 8);   // respiros
      Draw.box(gg, 4, -40, 30, 3, PAL.cream, { ol: 0, top: false, shade: false, r: 1.5 });               // faixa
    }
    function drawFender(gg) {
      gg.lineCap = 'round';
      gg.beginPath(); gg.arc(-26, -21, 28.5, PI * 1.02, PI * 1.9);
      gg.strokeStyle = LINE; gg.lineWidth = 9; gg.stroke();
      gg.strokeStyle = BODY; gg.lineWidth = 5; gg.stroke();
      gg.beginPath(); gg.arc(-26, -21, 29.6, PI * 1.08, PI * 1.84);
      gg.strokeStyle = shade(BODY, 0.3); gg.lineWidth = 1.6; gg.stroke();
    }

    /* ---- ciclo de trabalho ---- */
    function go(st) { S.st = st; S.st_t = 0; }
    function think(dt) {
      S.st_t += dt;
      const t = S.st_t;
      S.vT = 0;
      switch (S.st) {
        case 0: // vai pro monte com a caçamba no chão
          J.boom.set(0.065); S.abs = 0.06;
          S.vT = S.x < X_DIG - 26 ? 54 : 16;
          if (S.x >= X_DIG) { go(1); ch.nod(0.5); pile.kick(1.6); exhaust.burst(4, 1); ps.spray(S.x + 96, floor(S.x + 96) - 6, 14, Object.assign({}, GRAIN, { dir: -PI * 0.6, speed: [60, 150] })); }
          break;
        case 1: // enche: fecha a caçamba
          S.vT = t < 0.35 ? 10 : 0;
          if (t > 0.25) { S.abs = -0.82; S.load = Math.min(1, S.load + dt * 2.6); }
          if (t > 1.15) go(2);
          break;
        case 2: // recua levantando até a altura de transporte
          J.boom.set(-0.42); S.vT = -44;
          if (S.x <= 18) go(3);
          break;
        case 3: if (turnDone(-1, t)) go(4); break;
        case 4: // leva até a caixa, levantando tudo no fim
          S.vT = S.x > X_DUMP + 30 ? -58 : -18;
          if (S.x < X_DUMP + 70) J.boom.set(-1.02);
          if (S.x <= X_DUMP) go(5);
          break;
        case 5: // despeja
          if (t > 0.5 && J.boom.x < -0.9) {
            S.abs = 0.98;
            if (J.bucket.x + J.boom.x > 0.25 && S.load > 0) {
              S.load = Math.max(0, S.load - dt * 1.5); S.binFill = Math.min(1, S.binFill + dt * 0.3);
              rig.world('bucket', 36, 2, tmp);
              psBin.spray(tmp.x, tmp.y, 5, GRAIN);
            }
          }
          if (t > 2.3) { go(6); ch.nod(0.35); }
          break;
        case 6: // recua, nivela e abaixa
          S.abs = 0.06; S.vT = 40;
          if (t > 0.5) J.boom.set(0.065);
          if (S.x >= -62) go(7);
          break;
        case 7: if (turnDone(1, t)) go(0); break;
      }
    }
    function turnDone(to, t) { S.turnTo = to; return t > 0.25 && Math.abs(S.turn - to) < 0.02; }

    function update(dt) {
      S.t += dt;
      think(dt);
      // direção: vira "de papel" (face passa por 0) com ease
      const pt = S.turn;
      S.turn = U.clamp(S.turn + U.sign(S.turnTo - S.turn) * dt * 2.6, -1, 1);
      S.face = S.turn >= 0 ? 1 : -1;
      if ((pt >= 0) !== (S.turn >= 0)) ps.puff(S.x, floor(S.x) - 3, 5, 7, { c: PAL.sand });
      // velocidade com rampa (peso)
      S.v = U.damp(S.v, S.vT, Math.abs(S.vT) > Math.abs(S.v) ? 2.2 : 4.5, dt);
      S.x += S.v * dt;
      // carga na caçamba levantada: afunda e inclina pra frente
      ch.load = S.load * 1.4;
      ch.bias = S.load * 0.018 + (-J.boom.x) * 0.012;
      ch.update(dt, S.x, S.face);
      // juntas: a báscula se auto-nivela (alvo absoluto - ângulo da lança)
      J.bucket.set(S.abs - J.boom.x);
      const bv = J.boom.v;
      rig.update(dt);
      if (J.boom.hit > 0.3) ch.nod(0.4);
      ch.lean.kick((J.boom.v - bv) * 0.05 * S.face);            // reação da lança na carroceria
      // potência do motor -> tremor, fumaça
      const want = U.clamp(Math.abs(S.v) / 70 + Math.abs(J.boom.v) * 1.2 + Math.abs(J.bucket.v) * 0.25 + Math.max(0, S.vT * S.v > 0 ? Math.abs(S.vT - S.v) / 50 : 0), 0, 1);
      S.power = U.damp(S.power, want, 5, dt);
      const body = rig.get('body');
      body.y = -3 + Math.sin(S.t * 41) * (0.22 + S.power * 0.3);
      rig.get('hood').y = Math.sin(S.t * 41 + 1.3) * (0.25 + S.power * 0.4) - exhaust.pulse * 0.5;
      rig.get('boomF').rot = J.boom.x;
      for (const n of ['wRear', 'wFront']) { const p = rig.get(n), w = p.data; p.x = w.lx; p.y = w.ly; const f = rig.get(n + 'F'); f.x = w.lx + 4; f.y = w.ly - 2.5; }
      antenna.kick((-ch.ax * 0.0009 * S.face + ch.lean.v * 0.6) * dt * 60); antenna.update(dt);
      flap.target = exhaust.pulse * 0.9 + S.power * 0.5; flap.update(dt);
      pile.update(dt);
      // escapamento e poeira no mundo
      rig.solve(ch.x, ch.y, S.face, 1, ch.tilt);
      rig.world('hood', 18, -82, tmp);
      exhaust.update(dt, tmp.x, tmp.y, S.power, -S.v * 0.004, -1);
      if (Math.abs(S.v) > 20 && Math.random() < dt * 9) { const w = ch.wheels[0]; ps.puff(w.wx - U.sign(S.v) * 16, w.wy + w.r - 2, 1, 4.5, { c: PAL.sand }); }
      ps.update(dt, floor);
      psBin.update(dt, x => (x > BIN_X - 30 && x < BIN_X + 30 ? floor(BIN_X) - 8 - S.binFill * 26 : floor(x)));
      S.binFill = Math.max(0.12, S.binFill - dt * 0.012);
    }

    function draw(gg, v, cam) {
      scenery(gg, v, cam, floor, S.t, 1);
      // caixa de madeira que recebe o arroz
      const by = floor(BIN_X);
      Draw.shadow(gg, BIN_X, by + 1, 36, 4);
      Draw.box(gg, BIN_X - 28, by - 44, 56, 44, PAL.woodD, { top: false });
      gg.save(); gg.beginPath(); gg.rect(BIN_X - 26, by - 60, 52, 58); gg.clip();
      Rig.mound(gg, BIN_X, by - 6 - S.binFill * 28, 30, 12 + S.binFill * 8);
      gg.fillStyle = PAL.rice; gg.fillRect(BIN_X - 26, by - 7 - S.binFill * 28, 52, 40);
      gg.restore();
      psBin.draw(gg);
      Draw.box(gg, BIN_X - 30, by - 36, 60, 36, PAL.wood, { panels: 5, rivets: true });
      Draw.box(gg, BIN_X - 32, by - 40, 64, 5, PAL.woodL);
      ricePile(gg, PILE_X, floor(PILE_X) + 2, 66, 58, Math.max(-0.1, pile.x * 0.06));
      // sombra do trator
      Draw.shadow(gg, ch.x + S.face * 12, floor(ch.x) + 2, 62 * Math.max(0.3, Math.abs(Math.cos((1 - S.turn) * PI / 2))), 5, 0.2);
      exhaust.draw(gg);
      rig.draw(gg, ch.x, ch.y, { face: faceOf(S.turn), rot: ch.tilt, t: S.t });
      ps.draw(gg);
    }
    const faceOf = u => { const f = Math.sin(u * PI / 2); return Math.abs(f) < 0.1 ? (u >= 0 ? 0.1 : -0.1) : f; };
    return { rig, ch, J, S, update, draw, floor, cam: { x: 0, y: 0, z: 1, span: 292, tall: 176 }, follow(dt, cam) { cam.x = U.damp(cam.x, U.clamp(S.x + S.face * 34, -110, 100), 2.2, dt); }, title: 'Trator com carregadeira', sub: 'E.Chassis + E.Joint + rig.piston + E.Exhaust' };
  }

  /* ======================================================================
     2) ESCAVADEIRA HIDRÁULICA (IK)
     ====================================================================== */
  function makeExcavator() {
    const floor = x => -(1.6 * Math.sin(x * 0.03 + 1) + 0.8 * Math.sin(x * 0.09));
    const BODY = PAL.yel, CYL = PAL.blkL;
    const L1 = 80, L2 = 50, L3 = 30, FX = 30, FY = -12, HY = -31;      // pino da lança no espaço da casa; casa em (0,HY)
    const rig = Rig();
    const J = {
      slew: E.Joint(0, { k: 9, d: 5.2, min: 0, max: PI }),
      boom: E.Joint(-0.7, { k: 22, d: 7.5, min: -1.32, max: -0.02, speed: 1.3 }),
      stick: E.Joint(1.5, { k: 34, d: 9, min: 0.42, max: 2.55, speed: 2.0 }),
      bucket: E.Joint(0.6, { k: 60, d: 10.5, min: -0.75, max: 2.3, speed: 3.4 }),
    };
    const pitch = E.Spring(0, { k: 60, d: 6 }), heave = E.Spring(0, { k: 150, d: 9 });
    const exhaust = E.Exhaust({ size: 2.4, rate: 4, rise: 30 });
    const ps = E.Particles(400);
    const S = { x: 0, v: 0, phase: 0, t: 0, tx: 110, ty: -30, curl: 0, load: 0, manual: 0, auto_t: 0, power: 0, aimX: 110, aimY: -30, aimC: 0, heap: 0 };
    const ik = {}, tmp = {};
    const BOOM = [[0, 0, 6.5], [30, -13, 10.5], [80, 0, 5.4]];
    const STICK = [[-12, -2, 4], [3, -1.5, 7.2], [50, 0, 4.2]];

    rig.part('tracks', { z: 0, draw: gg => {
      Draw.track(gg, -46, -25, 92, 25, S.phase, { col: PAL.grayD });
      Draw.box(gg, -13, -32, 26, 8, PAL.steelD, { r: 2 });                           // rolamento de giro
    } });
    rig.part('house', { z: 2, y: HY, draw: drawHouse });
    rig.part('boom', { parent: 'house', z: 4, x: FX, y: FY, joint: J.boom, draw: gg => {
      Rig.plate(gg, BOOM, BODY);
      Rig.plate(gg, [[26, -20.5, 3.4], [36, -20, 3.4]], shade(BODY, -0.18), { hi: false, shade: false });   // orelha do cilindro do braço
      Rig.pin(gg, 0, 0, 3.2); Rig.pin(gg, 80, 0, 2.8); Rig.pin(gg, 32, -6, 2.2);
    } });
    rig.part('stick', { parent: 'boom', z: 5, x: L1, y: 0, joint: J.stick, draw: gg => {
      Rig.plate(gg, STICK, BODY);
      Rig.plate(gg, [[6, -4.5, 2.6], [12, -5, 2.6]], shade(BODY, -0.18), { hi: false, shade: false });
      Rig.pin(gg, 0, 0, 3); Rig.pin(gg, 50, 0, 2.4);
    } });
    rig.part('bucket', { parent: 'stick', z: 4.5, x: L2, y: 0, joint: J.bucket, draw: gg => Rig.bucket(gg, L3, { kind: 'excavator', col: PAL.gray, load: S.load }) });
    rig.part('cabfront', { parent: 'house', z: 6, draw: drawCab });
    rig.piston('pBoomF', { a: ['house', 46, -5], b: ['boom', 32, -6], w: 5.4, z: 3.5, dx: 3, dy: -2, col: shade(CYL, -0.2) });
    rig.piston('pBoom', { a: ['house', 44, -4], b: ['boom', 32, -6], w: 6, z: 4.6, col: CYL });
    rig.piston('pStick', { a: ['boom', 31, -21], b: ['stick', -12, -2], w: 5.2, z: 5.5, col: CYL });
    rig.piston('pBucket', { a: ['stick', 9, -5], b: ['bucket', -1, -12.5], w: 4.2, z: 5.6, col: CYL });
    rig.calibrate('pBoom', [['boom', J.boom.min, J.boom.max]]);
    rig.calibrate('pBoomF', [['boom', J.boom.min, J.boom.max]]);
    rig.calibrate('pStick', [['stick', J.stick.min, J.stick.max]]);
    rig.calibrate('pBucket', [['bucket', J.bucket.min, J.bucket.max]]);

    function drawHouse(gg, p, r, t) {
      // contrapeso, capô do motor, escapamento, plataforma
      Draw.box(gg, 22, -12, 26, 12, PAL.blkL, { r: 2 });                              // base do pino da lança
      Draw.box(gg, 16, -4, 4, 16, PAL.steelD);
      gg.save(); gg.translate(-22, -40); gg.rotate(0);
      Draw.box(gg, -2, -14, 4, 16, PAL.steelD); Draw.box(gg, -3.5, -9, 7, 9, PAL.blk, { r: 2 });
      gg.restore();
      Draw.box(gg, -52, -30, 16, 28, PAL.blk, { r: 6 });                              // contrapeso
      Draw.box(gg, -44, -40, 44, 36, BODY, { r: 5, panels: 3 });
      gg.fillStyle = shade(BODY, -0.3); for (let i = 0; i < 4; i++) gg.fillRect(-38 + i * 5, -32, 2.6, 11);
      Draw.box(gg, -46, -6, 88, 7, PAL.blkL, { r: 2 });
      Draw.hazard(gg, -40, -4.5, 28, 3, { ol: 0 });
    }
    function drawCab(gg, p, r, t) {
      Draw.box(gg, -6, -62, 32, 58, BODY, { r: 5 });
      Draw.window(gg, -2, -57, 24, 26, { glare: false, r: 3 });
      gg.save(); gg.beginPath(); gg.rect(-2, -57, 24, 26); gg.clip();
      E.drawShiba(gg, 9, -25, 'drive', t, { scale: 0.62, shadow: false });
      gg.fillStyle = 'rgba(255,255,255,.35)'; gg.beginPath(); gg.moveTo(12, -57); gg.lineTo(17, -57); gg.lineTo(5, -31); gg.lineTo(0, -31); gg.fill();
      gg.restore();
      Draw.box(gg, -8, -66, 36, 6, PAL.cream, { r: 2.5, shade: PAL.sand });
      Draw.light(gg, 24, -68.5, 2.4, PAL.goldL, true);
      Draw.box(gg, 0, -24, 20, 3, PAL.cream, { ol: 0, top: false, shade: false, r: 1.5 });
      Draw.light(gg, -1, -69, 2.6, PAL.ora, Math.sin(t * 8) > 0.3);
    }

    /* ---- alvo automático (quando ninguém mexe): cavar à direita, girar, despejar à esquerda ---- */
    const KEYS = [ // t, x, y, curl   (x,y no espaço do modelo; chão = 0)
      [0, 96, -44, 0.15], [1.2, 132, 2, 0], [2.4, 104, 9, 0.35], [3.3, 86, -8, 1], [4.3, 78, -62, 1],
      [5.2, -78, -62, 1], [7.2, -120, -52, 1], [7.9, -122, -50, 0], [9.2, -112, -60, 0], [10, 80, -60, 0.1], [12, 96, -44, 0.15],
    ];
    function autoAim(t) {
      t %= KEYS[KEYS.length - 1][0];
      let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] <= t) i++;
      const a = KEYS[i], b = KEYS[i + 1], u = U.smooth(U.clamp((t - a[0]) / (b[0] - a[0]), 0, 1));
      S.aimX = Math.abs(a[1] - b[1]) > 150 ? (u < 0.5 ? a[1] : b[1]) : U.lerp(a[1], b[1], u);
      S.aimY = U.lerp(a[2], b[2], u); S.aimC = U.lerp(a[3], b[3], u);
    }

    function update(dt, mouse) {
      S.t += dt;
      if (mouse && mouse.active) { S.manual = 3; S.aimX = mouse.x - S.x; S.aimY = mouse.y - floor(S.x); S.aimC = mouse.down ? 1 : 0; }
      if (S.manual > 0) { S.manual -= dt; if (S.manual <= 0) S.auto_t = 0; } else { S.auto_t += dt; autoAim(S.auto_t); }
      // alvo suavizado (o operador não teleporta a alavanca)
      S.tx = U.damp(S.tx, S.aimX, 9, dt); S.ty = U.damp(S.ty, Math.min(S.aimY, 12), 9, dt); S.curl = U.damp(S.curl, S.aimC, 7, dt);
      // anda na esteira se o alvo estiver longe demais
      const far = Math.abs(S.aimX) - 150;
      S.v = U.damp(S.v, S.manual > 0 && far > 0 ? U.sign(S.aimX) * Math.min(26, far) : 0, 2.5, dt);
      S.x += S.v * dt; S.phase += S.v * dt;
      // giro: a casa vira pro lado do alvo
      if (S.aimX < -14) J.slew.set(PI); else if (S.aimX > 14) J.slew.set(0);
      J.slew.update(dt);
      const cs = Math.cos(J.slew.x), side = cs >= 0 ? 1 : -1, mid = 1 - Math.abs(cs);
      const house = rig.get('house');
      house.sx = Math.abs(cs) < 0.1 ? 0.1 * side : cs;
      // IK no espaço da casa: durante o giro encolhe o braço
      let lx = Math.max(34, S.tx * side), ly = S.ty - HY;
      lx = U.lerp(lx, 64, mid * 0.8); ly = U.lerp(ly, -34, mid * 0.8);
      const tipA = U.lerp(1.5, 3.25, S.curl);
      E.ik3(FX, FY, lx, ly, L1, L2, L3, tipA, 1, ik);
      J.boom.set(ik.a1); J.stick.set(ik.rel2); J.bucket.set(ik.rel3);
      const bv = J.boom.v, sv = J.stick.v;
      rig.update(dt);
      // reação na carroceria: inclina com o alcance/carga e sacode quando as juntas aceleram ou batem no batente
      pitch.target = (0.012 + 0.03 * U.clamp((ik.reach - 0.55) * 2, 0, 1) + S.load * 0.012) * (1 - mid);
      pitch.kick(((J.boom.v - bv) * 0.035 + (J.stick.v - sv) * 0.015));
      if (J.boom.hit > 0.2 || J.stick.hit > 0.3) { pitch.kick(0.12); heave.kick(12); }
      pitch.update(dt); heave.update(dt);
      S.power = U.damp(S.power, U.clamp(Math.abs(J.boom.v) * 1.2 + Math.abs(J.stick.v) * 0.6 + Math.abs(J.bucket.v) * 0.25 + Math.abs(J.slew.v) * 0.7 + Math.abs(S.v) / 30, 0, 1), 5, dt);
      house.rot = U.clamp(pitch.x, -0.05, 0.07) * side; house.y = HY + heave.x + Math.sin(S.t * 38) * (0.2 + S.power * 0.3);
      rig.get('tracks').y = heave.x * 0.3;
      // carga: enche quando fecha a caçamba dentro do chão/monte; esvazia quando abre no alto
      rig.solve(S.x, floor(S.x), 1, 1, 0);
      rig.world('bucket', L3, 0, tmp);
      const inDirt = tmp.y > floor(tmp.x) - 3 - pileH(tmp.x);
      if (inDirt && Math.abs(J.bucket.v) + Math.abs(J.stick.v) > 0.25 && Math.random() < dt * 40) ps.spray(tmp.x, Math.min(tmp.y, floor(tmp.x) - 1), 2, Object.assign({}, GRAIN, { dir: -PI / 2, speed: [40, 120], spread: 1.1 }));
      if (inDirt && S.curl > 0.4) S.load = Math.min(1, S.load + dt * 2.2);
      const open = rig.world('bucket', 14, 8, {}).rot;
      if (S.load > 0 && S.curl < 0.35 && !inDirt) {
        S.load = Math.max(0, S.load - dt * 1.6);
        rig.world('bucket', 16, 4, tmp); ps.spray(tmp.x, tmp.y, 3, GRAIN);
        if (tmp.x < S.x - 60) S.heap = Math.min(1, S.heap + dt * 0.25);
      }
      S.heap = Math.max(0.15, S.heap - dt * 0.01);
      rig.world('house', -22, -55, tmp);
      exhaust.update(dt, tmp.x, tmp.y, S.power);
      ps.update(dt, x => floor(x) - pileH(x) * 0.6);
    }
    const PX = 142, HX = -124;
    function pileH(x) { const d = Math.abs(x - PX) / 46; const e = Math.abs(x - HX) / 30; return (d < 1 ? 30 * (1 - d * d) : 0) + (e < 1 ? (8 + 16 * S.heap) * (1 - e * e) : 0); }

    function draw(gg, v, cam) {
      scenery(gg, v, cam, floor, S.t, 4);
      ricePile(gg, PX, floor(PX) + 2, 50, 38, 0);
      ricePile(gg, HX, floor(HX) + 2, 26 + S.heap * 8, 10 + S.heap * 18, 0);
      E.drawShiba(gg, -62 + S.x * 0.2, floor(-62), S.load > 0.5 ? 'cheer' : 'wag', S.t, { scale: 0.7, face: 1, pal: 'goma' });
      Draw.shadow(gg, S.x, floor(S.x) + 2, 58, 5, 0.2);
      exhaust.draw(gg);
      rig.draw(gg, S.x, floor(S.x), { t: S.t });
      ps.draw(gg);
      // mira
      if (S.manual > 0) {
        const mx = S.x + S.aimX, my = floor(S.x) + S.aimY;
        gg.strokeStyle = PAL.cream; gg.lineWidth = 1.2; gg.beginPath(); gg.arc(mx, my, 5 + Math.sin(S.t * 6), 0, TAU); gg.moveTo(mx - 8, my); gg.lineTo(mx + 8, my); gg.moveTo(mx, my - 8); gg.lineTo(mx, my + 8); gg.stroke();
      }
    }
    return { rig, J, S, update, draw, floor, ik, cam: { x: 4, y: 0, z: 1, span: 310, tall: 172 }, follow(dt, cam) { cam.x = U.damp(cam.x, S.x + 4, 2, dt); }, title: 'Escavadeira hidráulica', sub: 'E.ik3 + 3 pistões · mova o mouse, segure pra fechar a caçamba' };
  }

  /* ======================================================================
     3) LINHA DE ESTEIRA + GUINCHO TELESCÓPICO
     ====================================================================== */
  function makeLine() {
    const floor = () => 0;
    const belt = E.Conveyor([[-250, -18], [-150, -18], [0, -86], [62, -86]], { w: 12, speed: 46, floor: 0, legGap: 64 });
    const ps = E.Particles(500);
    const S = { t: 0, feed: 0, bin: 0.2, shake: 0, sacks: 0, st: 0, st_t: 0, hold: false, pop: 0 };
    const BIN_X = 92, STACK_X = 244, MAST_X = 176;
    const binS = E.Spring(0, { k: 260, d: 10 }), hopS = E.Spring(0, { k: 300, d: 9 });
    belt.onDrop((vol, x, y, vx, vy) => {
      ps.spray(x, y, 5 + vol * 5, Object.assign({}, GRAIN, { dir: Math.atan2(40, vx), speed: [30, 90], spread: 0.5 }));
      S.bin = Math.min(1, S.bin + vol * 0.045); binS.kick(vol * 9);
    });
    // guincho: mastro telescópico, lança em T, carrinho, cabo tambor -> polia do carrinho -> gancho
    const mast = E.Telescope({ stages: 3, len: 36, w: 12, col: PAL.red });
    const M = { ext: E.Spring(0.35, { k: 16, d: 7 }), trolley: E.Spring(BIN_X + 8, { k: 9, d: 5.4 }), hook: E.Spring(-60, { k: 22, d: 8 }), swing: E.Spring(0, { k: 26, d: 1.6 }), top: {} };
    const rope = E.Rope({ pts: [{ x: 0, y: 0, r: 5, over: -1 }, { x: 0, y: 0, r: 3.6, over: -1 }, { x: 0, y: 0 }], lw: 1.4, pulleyCol: PAL.yel });
    const sack = E.sprite('rig.sack', 20, 16, P => {
      P.rrect(1, 3, 18, 13, 4, PAL.sack).rect(3, 13, 14, 3, PAL.sackD).rect(7, 0, 6, 4, PAL.sack).rect(7, 3, 6, 1, PAL.red);
      P.rect(4, 6, 3, 1, PAL.cream).rect(8, 8, 4, 4, PAL.red).rect(9, 9, 2, 2, PAL.cream);
    });

    function go(st) { S.st = st; S.st_t = 0; }
    function crane(dt) {
      S.st_t += dt;
      const t = S.st_t, binTop = -34, slot = S.sacks, stackTop = -11 - Math.floor(slot / 2) * 13 - 8;
      const sx = STACK_X + (slot % 2 ? 11 : -11) + (Math.floor(slot / 2) % 2 ? 5 : 0);
      switch (S.st) {
        case 0: M.trolley.target = BIN_X + 10; M.ext.target = 0.3; M.hook.target = -56; if (t > 1.4 && S.bin > 0.45) go(1); break;
        case 1: M.hook.target = binTop - 6; if (t > 1.3) { S.hold = true; S.bin = Math.max(0.1, S.bin - 0.3); binS.kick(-20); go(2); } break;
        case 2: M.hook.target = -70; M.ext.target = 1; if (t > 1.5) go(3); break;
        case 3: M.trolley.target = sx; if (t > 2.6) go(4); break;
        case 4: M.ext.target = 0.25; M.hook.target = stackTop - 8; if (t > 2.0) { S.hold = false; S.sacks++; S.pop = 1; ps.puff(sx, stackTop + 6, 4, 5, { c: PAL.sand }); go(5); } break;
        case 5: M.hook.target = -66; if (t > 0.9) { if (S.sacks >= 6) { for (let i = 0; i < 6; i++) ps.puff(STACK_X + U.rnd(-16, 16), -10 - U.rnd(0, 30), 2, 7, { c: PAL.cream }); S.sacks = 0; } go(0); } break;
      }
      const ptx = M.trolley.x, pv = M.trolley.v;
      M.ext.update(dt); M.trolley.update(dt); M.hook.update(dt);
      M.swing.kick(-(M.trolley.v - pv) * 0.09); M.swing.update(dt);
      mast.ext = U.clamp(M.ext.x, 0, 1);
      mast.tip(MAST_X, -6, -PI / 2, M.top);
      const jy = M.top.y - 5;
      rope.pts[0].x = MAST_X + 34; rope.pts[0].y = jy - 9;
      rope.pts[1].x = M.trolley.x; rope.pts[1].y = jy + 7;
      rope.pts[2].x = M.trolley.x - 3.6 + M.swing.x; rope.pts[2].y = Math.max(jy + 20, M.hook.x + Math.abs(M.swing.x) * 0.1);
      rope.update(dt);
      S.pop = Math.max(0, S.pop - dt * 4);
    }

    function update(dt) {
      S.t += dt;
      S.feed += dt;
      if (S.feed > 0.62) { S.feed = 0; belt.put(U.rnd(0.6, 1.3), 22); hopS.kick(26); ps.spray(-228, -40, 4, Object.assign({}, GRAIN, { speed: [10, 40], spread: 0.3 })); }
      belt.running = S.bin < 0.97;
      belt.update(dt);
      binS.update(dt); hopS.update(dt);
      crane(dt);
      ps.update(dt, x => (x > BIN_X - 30 && x < BIN_X + 30 ? -12 - S.bin * 26 : x < -150 && x > -250 ? -25 : 0));
    }

    function draw(gg, v, cam) {
      scenery(gg, v, cam, floor, S.t, 7);
      const jy = M.top.y - 5;
      // ---- guincho (atrás) ----
      Draw.shadow(gg, MAST_X, 2, 34, 4);
      Draw.box(gg, MAST_X - 24, -8, 48, 8, PAL.blkL, { r: 2, stripes: 3 });
      mast.draw(gg, MAST_X, -6, -PI / 2);
      // lança em T com treliça e contrapeso
      Draw.truss(gg, [MAST_X - 100, jy], [MAST_X + 100, jy], 7, 1.8, PAL.red, { taper: 1, bays: 14 });
      Draw.box(gg, MAST_X + 40, jy - 3, 16, 12, PAL.blk, { r: 2 });
      Draw.box(gg, MAST_X - 8, jy - 6, 16, 12, PAL.red, { r: 2 });
      Draw.cable(gg, [MAST_X, jy - 22], [MAST_X - 96, jy - 3], { lw: 1.1 });
      Draw.cable(gg, [MAST_X, jy - 22], [MAST_X + 52, jy - 3], { lw: 1.1 });
      Draw.beam(gg, [[MAST_X, jy - 4], [MAST_X, jy - 22]], 3, PAL.red);
      Draw.light(gg, MAST_X, jy - 25, 2.4, PAL.red, Math.sin(S.t * 4) > 0);
      // carrinho
      Draw.box(gg, M.trolley.x - 8, jy + 2.5, 16, 5, PAL.blkL, { r: 1.5 });
      Draw.circle(gg, M.trolley.x - 5, jy + 2.5, 1.8, PAL.steel, { ol: 1 }); Draw.circle(gg, M.trolley.x + 5, jy + 2.5, 1.8, PAL.steel, { ol: 1 });
      // ---- funil de alimentação e esteira ----
      belt.drawBack(gg);
      gg.save(); gg.translate(-228 + Math.sin(S.t * 31) * 0.5, -40 + hopS.x * 0.12);
      Draw.beam(gg, [[-20, -22], [-22, 40]], 3, PAL.steelD); Draw.beam(gg, [[20, -22], [22, 40]], 3, PAL.steelD);
      Rig.mound(gg, 0, -42, 22, 12);
      Draw.poly(gg, [[-26, -44], [26, -44], [26, -30], [7, -6], [7, 2], [-7, 2], [-7, -6], [-26, -30]], PAL.steel, { shade: true, hi: true });
      Draw.box(gg, -28, -47, 56, 5, PAL.steelD, { r: 1.5 });
      Draw.hazard(gg, -20, -36, 40, 4, { ol: 0 });
      gg.restore();
      belt.drawBelt(gg);
      belt.drawItems(gg);
      // ---- caixa que recebe ----
      const bs = binS.x * 0.02;
      gg.save(); gg.translate(BIN_X, 0); gg.scale(1 + bs, 1 - bs);
      Draw.shadow(gg, 0, 2, 36, 4);
      gg.save(); gg.beginPath(); gg.rect(-27, -70, 54, 68); gg.clip();
      Rig.mound(gg, -6, -10 - S.bin * 26, 30, 9 + S.bin * 9);
      gg.fillStyle = PAL.rice; gg.fillRect(-27, -11 - S.bin * 26, 54, 40);
      gg.restore();
      Draw.box(gg, -30, -30, 60, 30, PAL.wood, { panels: 5, rivets: true });
      Draw.box(gg, -32, -34, 64, 5, PAL.woodL);
      gg.restore();
      // ---- sacos empilhados ----
      Draw.box(gg, STACK_X - 30, -3, 64, 3, PAL.woodD);
      for (let i = 0; i < S.sacks; i++) {
        const row = Math.floor(i / 2), x = STACK_X + (i % 2 ? 11 : -11) + (row % 2 ? 5 : 0), sq = i === S.sacks - 1 ? S.pop * 0.25 : 0;
        E.drawSprite(gg, sack, x, -3 - row * 13, { sx: 1.3 * (1 + sq), sy: 1.3 * (1 - sq) });
      }
      E.drawShiba(gg, STACK_X + 40, 0, S.pop > 0 || S.st === 4 ? 'cheer' : 'sit', S.t, { scale: 0.8, face: -1, pal: 'kuro' });
      E.drawShiba(gg, -196, 0, 'wag', S.t, { scale: 0.8, face: -1 });
      // ---- cabo, gancho e carga (na frente) ----
      rope.draw(gg);
      const hk = rope.pts[2];
      gg.save(); gg.translate(hk.x, hk.y); gg.rotate(-M.swing.x * 0.04);
      Draw.box(gg, -3, 0, 6, 5, PAL.yel, { r: 1.5, ol: 1.4 });
      gg.strokeStyle = LINE; gg.lineWidth = 3.4; gg.lineCap = 'round'; gg.beginPath(); gg.arc(0, 8.5, 3, -PI * 0.5, PI * 0.9); gg.stroke();
      gg.strokeStyle = PAL.steel; gg.lineWidth = 1.5; gg.stroke();
      if (S.hold) E.drawSprite(gg, sack, 0, 26, { sx: 1.3, sy: 1.3 });
      gg.restore();
      ps.draw(gg);
    }
    return { belt, rope, mast, M, S, update, draw, floor, cam: { x: 16, y: 0, z: 1, span: 580, tall: 138 }, follow() {}, title: 'Esteira + guincho telescópico', sub: 'E.Conveyor + E.Telescope + E.Rope' };
  }

  /* ======================================================================
     Painéis, laço e automação
     ====================================================================== */
  const tr = makeTractor(), ex = makeExcavator(), ln = makeLine();
  const all = [tr, ex, ln];
  const panels = ONLY ? [{ s: all[ONLY - 1], x: 0, y: 0, w: W, h: H, full: true }]
    : [{ s: tr, x: 0, y: 0, w: 478, h: 298 }, { s: ex, x: 482, y: 0, w: 478, h: 298 }, { s: ln, x: 0, y: 302, w: 960, h: 238 }];
  // zoom pra caber a largura útil da cena no painel; chão a ~85% da altura
  for (const p of panels) {
    const c = p.s.cam;
    c.z = q.has('z') && ONLY ? +q.get('z') : Math.min(p.w / c.span, p.h / c.tall);
    c.y = -(0.85 - 0.5) * p.h / c.z;
  }
  const view = { x0: 0, x1: 0, y0: 0, y1: 0 }, mouse = { x: 0, y: 0, down: false, active: false };
  let moved = 0;
  input.on('move', () => { moved = 2.5; });
  input.on('down', () => { moved = 2.5; });

  function update(dt) {
    moved -= dt;
    // mouse -> mundo da escavadeira
    const p = panels.find(p => p.s === ex);
    mouse.active = false;
    if (p && moved > 0 && input.x >= p.x && input.x < p.x + p.w && input.y >= p.y && input.y < p.y + p.h) {
      const c = ex.cam;
      mouse.x = (input.x - p.x - p.w / 2) / c.z + c.x; mouse.y = (input.y - p.y - p.h * 0.5) / c.z + c.y;
      mouse.down = input.down; mouse.active = true;
    }
    for (const p of panels) { p.s.update(dt, mouse); p.s.follow(dt, p.s.cam); }
  }
  function render() {
    stage.begin();
    for (const p of panels) {
      const c = p.s.cam;
      g.save();
      g.beginPath(); g.rect(p.x, p.y, p.w, p.h); g.clip();
      g.translate(p.x + p.w / 2, p.y + p.h * 0.5); g.scale(c.z, c.z); g.translate(-c.x, -c.y);
      view.x0 = c.x - p.w / 2 / c.z; view.x1 = c.x + p.w / 2 / c.z; view.y0 = c.y - p.h / 2 / c.z; view.y1 = c.y + p.h / 2 / c.z;
      Draw.lod(c.z);
      p.s.draw(g, view, c);
      g.restore();
      Draw.lod(1);
      Draw.text(g, p.s.title, p.x + 14, p.y + 22, { size: 17, align: 'left', col: PAL.cream, sw: 4 });
      Draw.text(g, p.s.sub, p.x + 14, p.y + 40, { size: 10.5, align: 'left', col: PAL.goldL, sw: 3, weight: 700 });
    }
  }
  const loop = E.Loop({ update, render, input });
  loop.start();

  window.__demo = {
    tr, ex, ln, loop, stage,
    // step(seg): avança a simulação em passos fixos (pra screenshots determinísticos)
    step(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); return true; },
    // aim(x, y, curl): mira a escavadeira (modelo: x pra frente da máquina, chão = 0) por 60 s
    aim(x, y, curl) { ex.S.manual = 60; ex.S.aimX = x; ex.S.aimY = y; ex.S.aimC = curl || 0; return true; },
  };
})();
</script>
